id-template-columns:repeat(4,1fr);gap:10px}.metric{background:#ffffff06;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:var(--muted)}.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:13px;padding:10px 14px}.btn.primary{background:var(--blue);color:#04101d;border-color:var(--blue);font-weight:800}.btn.danger{background:#ff5d7015;color:#ff7c8c;border-color:#ff5d7050}.btn.small{padding:7px 10px;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#081423f5;border-top:1px solid var(--line);backdrop-filter:blur(20px);display:flex;justify-content:center}.navinner{max-width:760px;width:100%;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:var(--muted);padding:12px 8px;font-size:11px}.nav button.active{color:var(--blue)}.nav b{display:block;font-size:18px}.section{margin-top:24px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sectiontitle h2{font-size:18px;margin:0}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#071321;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}.field textarea{min-height:120px;resize:vertical}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{max-width:430px;width:100%}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap}.ovr{display:flex;align-items:center;gap:15px}.ovrnum{font-size:54px;font-weight:950;line-height:1}.bar{height:8px;background:#ffffff10;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.ratingRow{display:flex;gap:8px;overflow:auto}.ratingDot{min-width:54px;text-align:center;padding:10px;border-radius:14px;background:#ffffff08;border:1px solid var(--line);font-weight:800}.modal{position:fixed;inset:0;z-index:20;background:#0009;display:grid;place-items:end}.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:#0b1929;border:1px solid var(--line);border-radius:25px 25px 0 0;padding:20px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.close{border:0;background:#ffffff10;color:white;border-radius:50%;width:36px;height:36px;font-size:24px}.vote{margin-top:10px}.vote button{width:100%;text-align:left;margin-top:7px}.voteResult{height:7px;background:#ffffff0d;border-radius:8px;margin-top:5px;overflow:hidden}.voteResult span{display:block;height:100%;background:var(--blue)}.news{position:relative}.news h3{margin:6px 0}.news p{white-space:pre-wrap;line-height:1.55}.adminGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.adminTile{padding:20px;border-radius:18px;background:#ffffff06;border:1px solid var(--line);cursor:pointer}.photoPreview{width:100px;height:100px;object-fit:cover;border-radius:20px;background:#ffffff08}.hide{display:none!important}@media(max-width:650px){.grid,.formgrid{grid-template-columns:1fr}.grid3,.adminGrid{grid-template-columns:1fr 1fr}.metricGrid{grid-template-columns:repeat(2,1fr)}.playerHero{height:245px}.hero h1{font-size:29px}}

const FIREBASE_CONFIG={apiKey:'AIzaSyDc9AIpeiloHQplOlh7tpkdLCQlX8siQgA',authDomain:'playerhub-3b588.firebaseapp.com',projectId:'playerhub-3b588',storageBucket:'playerhub-3b588.firebasestorage.app',messagingSenderId:'288970150411',appId:'1:288970150411:web:7f8e9d8abcd009925ded0e'};
const FCM_VAPID_KEY='BDX9sxTkHntBKcuUfR0t2T_uxFpCP49TBVHk6tWnDmbP1zlsaX4dV5BM_nqqnIFeeUdTgyYIeHC-NsQ0My4GQw0';

let sb=null,cloudReady=false;

async function cloudInit(){
 if(!CLOUD.url||!CLOUD.key)return false;
 if(!window.supabase){await new Promise((res,rej)=>{let x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';x.onload=res;x.onerror=rej;document.head.appendChild(x)})}
 sb=window.supabase.createClient(CLOUD.url,CLOUD.key);cloudReady=true;return true;
}
async function cloudSession(){if(!await cloudInit())return null;let r=await sb.auth.getSession();return r.data.session?.user||null}
async function initPush(){try{if(!('Notification'in window))throw new Error('Dieser Browser unterstützt keine Push-Benachrichtigungen.');if(!('serviceWorker'in navigator))throw new Error('Service Worker werden nicht unterstützt.');if(!me||!cloudReady)throw new Error('Bitte zuerst einloggen.');if(!firebaseApp){firebaseApp=firebase.initializeApp(FIREBASE_CONFIG);messaging=firebase.messaging()}const registration=await navigator.serviceWorker.register('/PlayerHub/firebase-messaging-sw.js',{scope:'/PlayerHub/'});const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('Push-Benachrichtigungen wurden nicht erlaubt.');const token=await messaging.getToken({vapidKey:FCM_VAPID_KEY,serviceWorkerRegistration:registration});if(!token)throw new Error('Firebase konnte kein Push-Token erstellen.');const r=await sb.rpc('save_push_subscription',{p_token:token,p_platform:'web'});if(r.error)throw new Error(r.error.message);localStorage.setItem('playerhub_push_enabled','1');render();alert('🔔 PlayerHub-Push ist aktiviert!');return true}catch(e){console.error(e);alert('Push konnte nicht aktiviert werden.\n\n'+e.message);return false}}

async function cloudLoad(){if(!cloudReady)return false;
 let u=await cloudSession();if(!u)return false;
 if(localStorage.getItem('ph_pending_admin')==='1'){await sb.rpc('claim_admin',{p_code:ADMIN_CODE});localStorage.removeItem('ph_pending_admin');}
 let pr=await sb.from('profiles').select('*').eq('id',u.id).single();
 me={id:u.id,name:pr.data?.display_name||u.email,role:pr.data?.role||'user',email:u.email};
 let us=await sb.from('profiles').select('id,display_name,role'); data.users=(us.data||[]).map(x=>({id:x.id,name:x.display_name,email:'',role:x.role||'user'}));
 let [ps,ns,vs]=await Promise.all([sb.from('players').select('*').order('created_at',{ascending:false}),sb.from('news').select('*').order('created_at',{ascending:false}),sb.from('votes').select('*').order('created_at',{ascending:false})]);
 if(ps.error||ns.error||vs.error)return false;
 data.players=(ps.data||[]).map(x=>({id:x.id,first:x.first_name,last:x.last_name,pos:x.position||'',foot:x.strong_foot||'',num:x.number||0,age:x.age||0,img:x.image_url||'',games:x.games||0,goals:x.goals||0,assists:x.assists||0,shots:x.shots||0,onTarget:x.shots_on_target||0,yellow:x.yellow||0,red:x.red||0,saves:x.saves||0,clean:x.clean_sheets||0,ratings:x.ratings||[],injured:x.injured||false,injury:x.injury||'',suspended:x.suspended||false,suspReason:x.suspension_reason||''}));
 data.votes=(vs.data||[]); data.news=(ns.data||[]).map(n=>{let v=data.votes.find(x=>x.id===n.vote_id);return {...n,poll:v?{vote_id:v.id,id:v.id,title:v.title,options:(v.options||[]).map((x,i)=>({id:x,label:x})),votes:v.votes||{}}:null}});return true;
}
async function cloudSignIn(email,pin){if(!await cloudInit())return {ok:false,error:'Cloud konnte nicht geladen werden.'};let r=await sb.auth.signInWithPassword({email,password:pin});if(r.error)return {ok:false,error:r.error.message};let loaded=await cloudLoad();if(!loaded)return {ok:false,error:'Anmeldung erfolgreich, aber das Profil konnte nicht geladen werden.'};return {ok:true,user:r.data.user}}
async function cloudSignUp(email,name,pin,admin=false){if(!await cloudInit())return {ok:false,error:'Supabase konnte nicht geladen werden.'};let r=await sb.auth.signUp({email,password:pin,options:{data:{display_name:name}}});let user=r.data?.user;if(r.error){
  if(String(r.error.message||'').toLowerCase().includes('already registered')||String(r.error.message||'').toLowerCase().includes('already exists')){
    let si=await sb.auth.signInWithPassword({email,password:pin});
    if(si.error)return {ok:false,error:'Dieser Account existiert bereits. Anmeldung fehlgeschlagen: '+si.error.message};
    user=si.data.user;
  } else return {ok:false,error:r.error.message};
}
if(!user)return {ok:false,error:'Supabase hat keinen Benutzer zurückgegeben.'};
if(!r.data?.session){let si=await sb.auth.signInWithPassword({email,password:pin});if(si.error)return {ok:false,error:'Account wurde erstellt, aber die Anmeldung danach ist fehlgeschlagen: '+si.error.message};user=si.data.user;}
let pr=await sb.from('profiles').upsert({id:user.id,display_name:name,role:'user'});
if(pr.error)return {ok:false,error:'Profil konnte nicht erstellt werden: '+pr.error.message};
if(admin){let a=await sb.rpc('claim_admin',{p_code:ADMIN_CODE});if(a.error)return {ok:false,error:'Admin-Rechte konnten nicht gesetzt werden: '+a.error.message};}
let loaded=await cloudLoad();if(!loaded)return {ok:false,error:'Account erstellt, aber PlayerHub konnte das Profil nicht laden.'};return {ok:true,user};}
async function cloudLogout(){if(sb)await sb.auth.signOut();}
async function loadFirebaseSDK(){
  if(window.firebase) return true;
  try{
    await new Promise((res,rej)=>{let a=document.createElement('script');a.src='https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js';a.onload=res;a.onerror=rej;document.head.appendChild(a)});
    await new Promise((res,rej)=>{let a=document.createElement('script');a.src='https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js';a.onload=res;a.onerror=rej;document.head.appendChild(a)});
    return true;
  }catch(e){return false}
}
function pushConfigured(){return Object.values(PUSH_CONFIG).every(Boolean)}
async function enablePush(){return await initPush()}
async function sendPush(title,body,type='general'){
  if(!cloudReady||!me||me.role!=='admin')return;
  try{
    let {data:sessionData}=await sb.auth.getSession();let token=sessionData?.session?.access_token;if(!token)return;
    let r=await fetch((CLOUD.url||'')+'/functions/v1/send-push',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':CLOUD.key},body:JSON.stringify({title,body,type})});
    if(!r.ok){let t=await r.text();console.warn('Push send failed',t)}
  }catch(e){console.warn('Push send failed',e)}
}
function pushTile(){return `<div class="section"><div class="card"><div class="row between"><div><b>🔔 Push-Benachrichtigungen</b><div class="meta">News und Player-of-the-Month-Updates direkt aufs Gerät.</div></div><button class="btn primary small" onclick="enablePush()">Aktivieren</button></div></div></div>`}
function calc(p){let avg=p.ratings.length?p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length:6;let recent=p.ratings.length?p.ratings[p.ratings.length-1]:avg;let base=20+Math.min(35,avg*4.2)+Math.min(12,p.games*.45)+Math.min(15,p.goals*2.2)+Math.min(10,p.assists*1.4)+Math.min(6,p.shots*.18)-p.yellow*.7-p.red*3-(p.suspended?2:0);if(p.pos==='TW')base+=Math.min(12,p.saves*.45)+Math.min(8,p.clean*1.2);else base+=Math.min(7,p.onTarget*.3);let ovr=Math.max(20,Math.min(99,Math.round(base)));let kb=Math.max(0,Math.round(p.games*5+p.goals*15+p.assists*9+p.shots*1.2+p.onTarget*2+(p.pos==='TW'?p.saves*1.8+p.clean*5:0)+avg*4-p.yellow*3-p.red*12-(p.suspended?8:0)));return{avg,recent,ovr,kb}}
function status(p){if(p.injured)return `<span class="pill red">🔴 Verletzt${p.injury?' · '+esc(p.injury):''}</span>`;if(p.suspended)return `<span class="pill red">🟥 Gesperrt${p.suspReason?' · '+esc(p.suspReason):''}</span>`;return '<span class="pill green">🟢 Fit</span>'}
function header(){return `<header class="top"><div class="toprow between"><div class="brand">Player<span>Hub</span> ⚽</div><div class="row"><span class="meta">${esc(me.name)}</span><button class="btn small" onclick="logout()">Logout</button></div></div></header>`}
function nav(){let items=[['home','🏠','Home'],['players','👥','Spieler'],['news','📰','News'],['votes','🗳️','Votes']];if(me.role==='admin')items.push(['admin','⚙️','Admin']);return `<nav class="nav"><div class="navinner">${items.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</div></nav>`}
function pushCard(){const enabled=localStorage.getItem('playerhub_push_enabled')==='1';return `<div class="card" style="margin-bottom:18px"><div class="row between"><div><div class="eyebrow">BENACHRICHTIGUNGEN</div><h2 style="margin:5px 0">🔔 PlayerHub Push</h2><p class="hint">${enabled?'Push-Benachrichtigungen sind aktiviert.':'Erhalte automatisch News und Player-of-the-Month-Updates.'}</p></div>${enabled?'<span class="pill green">🟢 Aktiv</span>':'<button class="btn primary" onclick="initPush()">Push aktivieren</button>'}</div></div>`}
function home(){let top=[...data.players].sort((a,b)=>calc(b).ovr-calc(a).ovr).slice(0,3);return `${pushCard()}<section class="hero"><div class="eyebrow">PLAYERZENTRALE</div><h1>Alles über eure Spieler.</h1><p>Form, Leistungen, News und Abstimmungen an einem Ort.</p></section><div class="grid3">${top.map(playerCard).join('')||'<div class="card"><b>Noch keine Spieler</b><p class="hint">Im Admin-Bereich kannst du die ersten Profile anlegen.</p></div>'}</div><div class="section"><div class="sectiontitle"><h2>📰 Neueste News</h2><button class="btn small" onclick="go('news')">Alle</button></div>${newsList(3)}</div><div class="section"><div class="sectiontitle"><h2>🏆 Player of the Month</h2></div>${monthBox()}</div>`}
function playerCard(p){let c=calc(p);return `<div class="card playerCard" onclick="profile('${p.id}')"><div class="playerHero">${p.img?`<img src="${p.img}" alt="">`:''}<div class="playerOverlay"><div class="eyebrow">#${p.num} · ${esc(p.pos)}</div><div class="name">${esc(p.first+' '+p.last)}</div><div class="row"><span class="pill">OVR ${c.ovr}</span><span class="pill">Form ${c.recent.toFixed(1)}</span></div></div></div><div style="padding:13px"><div class="row between"><span>${status(p)}</span><b>${c.kb} PKT</b></div></div></div>`}
function players(){return `<div class="hero"><div class="eyebrow">KADER</div><h1>Spieler</h1><p>Jedes Profil wird aus den eingetragenen Daten automatisch berechnet.</p></div><div class="grid">${data.players.map(playerCard).join('')||'<div class="card"><p class="hint">Noch keine Spieler angelegt.</p></div>'}</div>`}
function profile(id){let p=data.players.find(x=>x.id===id);if(!p)return;let c=calc(p);document.getElementById('root').innerHTML=header()+`<main class="main"><button class="btn" onclick="go('players')">← Zurück</button><div class="card" style="margin-top:14px;padding:0;overflow:hidden"><div class="playerHero" style="height:340px">${p.img?`<img src="${p.img}" alt="">`:''}<div class="playerOverlay"><div class="eyebrow">#${p.num} · ${esc(p.pos)} · ${esc(p.foot)} Fuß</div><div class="name" style="font-size:34px">${esc(p.first)}<br>${esc(p.last)}</div><div class="row" style="margin-top:9px"><span class="pill">${p.age} Jahre</span>${status(p)}</div></div></div><div style="padding:18px"><div class="grid"><div class="card"><div class="eyebrow">OVERALL</div><div class="ovr"><div class="ovrnum">${c.ovr}</div><div style="flex:1"><div class="bar"><span style="width:${c.ovr}%"></span></div><p class="meta">Automatisch aus Leistungsdaten</p></div></div></div><div class="card"><div class="eyebrow">FORM</div><div class="ovrnum">${c.recent.toFixed(1)}<span class="meta" style="font-size:16px"> / 10</span></div><p class="meta">Ø ${c.avg.toFixed(1)} aus ${p.ratings.length} Bewertungen</p></div></div><div class="sectiontitle"><h2>📊 Saison</h2></div><div class="metricGrid"><div class="metric"><b>${p.games}</b><span>Spiele</span></div><div class="metric"><b>${p.goals}</b><span>Tore</span></div><div class="metric"><b>${p.assists}</b><span>Vorlagen</span></div><div class="metric"><b>${p.shots}</b><span>Schüsse</span></div><div class="metric"><b>${p.onTarget}</b><span>Aufs Tor</span></div><div class="metric"><b>${c.kb}</b><span>Kickbase-Punkte</span></div>${p.pos==='TW'?`<div class="metric"><b>${p.saves}</b><span>Paraden</span></div><div class="metric"><b>${p.clean}</b><span>Zu Null</span></div>`:''}<div class="metric"><b>${p.yellow}</b><span>Gelbe Karten</span></div><div class="metric"><b>${p.red}</b><span>Rote Karten</span></div></div><div class="sectiontitle"><h2>⭐ Spielbewertungen</h2></div><div class="ratingRow">${p.ratings.length?p.ratings.map(x=>`<div class="ratingDot">${Number(x).toFixed(1)}</div>`).join(''):'<span class="hint">Noch keine Bewertungen.</span>'}</div><div class="sectiontitle"><h2>🩺 Verfügbarkeit</h2></div><div class="card">${status(p)}${p.suspended&&p.suspReason?`<p class="hint">Sperrgrund: ${esc(p.suspReason)}</p>`:''}</div></div></div></div>${nav()}`}
function newsList(limit){let arr=limit?data.news.slice(0,limit):data.news;return arr.map(n=>`<article class="card news" style="margin-bottom:12px"><div class="eyebrow">${esc(n.time)}</div><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>${n.poll?pollHTML(n):''}${me.role==='admin'?`<button class="btn danger small" onclick="deleteNews('${n.id}')">News löschen</button>`:''}</article>`).join('')||'<div class="card"><p class="hint">Noch keine News.</p></div>'}
function pollHTML(n){let v=n.poll, votes=v.votes||{},total=Object.keys(votes).length;return `<div class="vote"><b>🗳️ ${esc(v.title)}</b>${v.options.map(o=>{let count=Object.values(votes).filter(x=>x===o.id).length,pct=total?Math.round(count/total*100):0;return `<button class="btn" onclick="castNews('${v.id}','${o.id}')">${esc(o.label)} <span style="float:right">${pct}%</span><div class="voteResult"><span style="width:${pct}%"></span></div></button>`}).join('')}<small class="meta">${total} Stimme${total===1?'':'n'}</small></div>`}
function votes(){return `<div class="hero"><div class="eyebrow">COMMUNITY</div><h1>Abstimmungen</h1><p>Jeder eingeloggte Nutzer kann pro Abstimmung einmal abstimmen.</p></div>${data.votes.map(v=>voteHTML(v)).join('')||'<div class="card"><p class="hint">Noch keine Abstimmungen.</p></div>'}<div class="section"><h2>🏆 Player of the Month</h2>${monthBox()}</div>`}
function voteHTML(v){let total=Object.keys(v.votes||{}).length;return `<div class="card" style="margin-bottom:12px"><div class="eyebrow">ABSTIMMUNG</div><h3>${esc(v.title)}</h3>${v.options.map(id=>{let p=data.players.find(x=>x.id===id);if(!p)return '';let count=Object.values(v.votes||{}).filter(x=>x===id).length,pct=total?Math.round(count/total*100):0;return `<button class="btn" style="width:100%;margin-top:7px" onclick="vote('${v.id}','${id}')">${esc(p.first+' '+p.last)} <span style="float:right">${pct}%</span><div class="voteResult"><span style="width:${pct}%"></span></div></button>`}).join('')}<small class="meta">${total} Stimme${total===1?'':'n'}</small></div>`}
function monthBox(){let scores=data.players.map(p=>{let c=calc(p);return{p,c,score:Math.round(c.ovr*.45+c.avg*5+c.kb*.12)}}).sort((a,b)=>b.score-a.score);let top=scores[0];if(!top)return '<div class="card"><p class="hint">Noch keine Spieler.</p></div>';return `<div class="card"><div class="row between"><div><div class="eyebrow">AKTUELLER PERFORMANCE-SCORE</div><h2 style="margin:5px 0">🏆 ${esc(top.p.first+' '+top.p.last)}</h2><p class="hint">Score ${top.score}/100 · OVR ${top.c.ovr} · Ø Form ${top.c.avg.toFixed(1)}</p></div><b class="gold" style="font-size:30px">${top.score}</b></div></div>`}
function admin(){return pushTile()+`<div class="hero"><div class="eyebrow">ADMIN</div><h1>Verwaltung</h1><p>Nur Administratoren können Inhalte und Spielerwerte verändern.</p></div><div class="adminGrid"><div class="adminTile" onclick="playerForm()">➕<br><b>Spieler</b><br><span class="meta">Profil erstellen</span></div><div class="adminTile" onclick="newsForm()">📰<br><b>News</b><br><span class="meta">News + Vote erstellen</span></div><div class="adminTile" onclick="voteForm()">🗳️<br><b>Abstimmung</b><br><span class="meta">Community-Vote</span></div><div class="adminTile" onclick="notifyPotm()">🏆<br><b>Player of the Month</b><br><span class="meta">Festlegen + Push senden</span></div></div><div class="section"><div class="sectiontitle"><h2>👥 Spieler verwalten</h2></div>${data.players.map(p=>`<div class="card" style="margin-bottom:10px"><div class="row between"><div><b>${esc(p.first+' '+p.last)}</b><div class="meta">${esc(p.pos)} · OVR ${calc(p).ovr}</div></div><button class="btn small" onclick="playerForm('${p.id}')">Bearbeiten</button></div></div>`).join('')||'<p class="hint">Noch keine Spieler.</p>'}</div><div class="section"><div class="sectiontitle"><h2>🔐 Nutzer</h2><button class="btn small" onclick="userForm()">+ Nutzer</button></div>${data.users.map(u=>`<div class="card" style="margin-bottom:8px"><div class="row between"><span><b>${esc(u.name)}</b> <span class="pill">${u.role}</span></span>${u.id!=='admin'?`<button class="btn danger small" onclick="deleteUser('${u.id}')">Löschen</button>`:''}</div></div>`).join('')}</div>`}
function openModal(html){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(m)}function closeModal(){document.querySelector('.modal')?.remove()}
function playerForm(id){let p=id?data.players.find(x=>x.id===id):{id:crypto.randomUUID(),first:'',last:'',pos:'ST',foot:'Rechts',num:9,age:14,img:'',games:0,goals:0,assists:0,shots:0,onTarget:0,yellow:0,red:0,suspended:false,suspReason:'',injured:false,injury:'',ratings:[],saves:0,clean:0};openModal(`<div class="sheethead"><h2>${id?'Spieler bearbeiten':'Spieler hinzufügen'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePlayer(event,'${p.id}',${!!id})"><div class="formgrid"><div class="field"><label>Vorname</label><input name="first" value="${esc(p.first)}" required></div><div class="field"><label>Nachname</label><input name="last" value="${esc(p.last)}" required></div><div class="field"><label>Position</label><select name="pos">${['TW','IV','AV','ZM','ZOM','RM','LM','ST'].map(x=>`<option ${p.pos===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Nummer</label><input name="num" type="number" value="${p.num}"></div><div class="field"><label>Alter</label><input name="age" type="number" value="${p.age}"></div><div class="field"><label>Starker Fuß</label><select name="foot">${['Rechts','Links','Beide'].map(x=>`<option ${p.foot===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="sectiontitle"><h2>📸 Profilbild</h2></div><input name="img" id="imgfile" type="file" accept="image/*" onchange="previewImage(event)"><div id="imgprev" style="margin-top:10px">${p.img?`<img class="photoPreview" src="${p.img}">`:''}</div><div class="sectiontitle"><h2>📊 Leistungsdaten</h2></div><div class="formgrid">${[['games','Spiele'],['goals','Tore'],['assists','Vorlagen'],['shots','Schüsse'],['onTarget','Schüsse aufs Tor'],['yellow','Gelbe Karten'],['red','Rote Karten'],['saves','Paraden (TW)'],['clean','Zu Null (TW)']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" type="number" value="${p[k]||0}"></div>`).join('')}</div><div class="sectiontitle"><h2>🩺 Status</h2></div><div class="formgrid"><div class="field"><label>Verletzt?</label><select name="injured"><option value="0" ${!p.injured?'selected':''}>Nein</option><option value="1" ${p.injured?'selected':''}>Ja</option></select></div><div class="field"><label>Verletzung</label><input name="injury" value="${esc(p.injury)}" placeholder="z. B. Sprunggelenk"></div><div class="field"><label>Gesperrt?</label><select name="suspended"><option value="0" ${!p.suspended?'selected':''}>Nein</option><option value="1" ${p.suspended?'selected':''}>Ja</option></select></div><div class="field"><label>Sperrgrund</label><input name="suspReason" value="${esc(p.suspReason)}" placeholder="z. B. 5. Gelbe Karte"></div></div><div class="sectiontitle"><h2>⭐ Bewertungen</h2></div><div class="field"><label>Letzte Bewertungen, Komma-getrennt</label><input name="ratings" value="${p.ratings.join(', ')}" placeholder="7.2, 8.1, 9.0"></div><button class="btn primary" style="margin-top:18px;width:100%">Speichern & automatisch berechnen</button>${id?`<button type="button" class="btn danger" style="margin-top:8px;width:100%" onclick="deletePlayer('${p.id}')">Spieler löschen</button>`:''}</form>`)}
function previewImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>document.getElementById('imgprev').innerHTML=`<img class="photoPreview" src="${r.result}">`;r.readAsDataURL(f)}
function compress(file,cb){let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(file)}
async function savePlayer(e,id,editing){e.preventDefault();let f=new FormData(e.target),p=data.players.find(x=>x.id===id)||{id};['first','last','pos','foot','injury','suspReason'].forEach(k=>p[k]=f.get(k));['num','age','games','goals','assists','shots','onTarget','yellow','red','saves','clean'].forEach(k=>p[k]=Number(f.get(k)||0));p.injured=f.get('injured')==='1';p.suspended=f.get('suspended')==='1';p.ratings=String(f.get('ratings')||'').split(',').map(Number).filter(x=>x>0);let file=document.getElementById('imgfile').files[0];let done=async src=>{if(src)p.img=src;if(cloudReady){let row={id:p.id,first_name:p.first,last_name:p.last,position:p.pos,strong_foot:p.foot,number:p.num,age:p.age,image_url:p.img||null,games:p.games,goals:p.goals,assists:p.assists,shots:p.shots,shots_on_target:p.onTarget,yellow:p.yellow,red:p.red,saves:p.saves,clean_sheets:p.clean,ratings:p.ratings,injured:p.injured,injury:p.injury,suspended:p.suspended,suspension_reason:p.suspReason};let r=await sb.from('players').upsert(row);if(r.error)return alert(r.error.message);await cloudLoad()}else{if(!editing)data.players.push(p);save()}closeModal();render()};file?compress(file,done):done(null)}
async function deletePlayer(id){if(!confirm('Spieler wirklich löschen?'))return;if(cloudReady){let r=await sb.from('players').delete().eq('id',id);if(r.error)return alert(r.error.message);await cloudLoad()}else{data.players=data.players.filter(p=>p.id!==id);save()}closeModal();render()}
function newsForm(){openModal(`<div class="sheethead"><h2>📰 News erstellen</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveNews(event)"><div class="field"><label>Überschrift</label><input name="title" required></div><div class="field" style="margin-top:10px"><label>Nachricht</label><textarea name="text" required></textarea></div><div class="sectiontitle"><h2>🗳️ Abstimmung einfügen?</h2></div><select name="poll"><option value="0">Keine Abstimmung</option><option value="1">Ja, Abstimmung anhängen</option></select><div class="field" style="margin-top:10px"><label>Frage</label><input name="polltitle" placeholder="Wer war Spieler des Spiels?"></div><div class="field" style="margin-top:10px"><label>Antworten</label><input name="pollopts" placeholder="Heinze, Hüller, Wachowski"></div><button class="btn primary" style="margin-top:18px;width:100%">Veröffentlichen</button></form>`)}
async function saveNews(e){e.preventDefault();let f=new FormData(e.target),poll=null;if(f.get('poll')==='1'){let opts=String(f.get('pollopts')).split(',').map(x=>x.trim()).filter(Boolean);if(opts.length<2)return alert('Bitte mindestens zwei Antworten eintragen.');let v={id:crypto.randomUUID(),title:f.get('polltitle')||'Abstimmung',options:opts,votes:{}};if(cloudReady){let vr=await sb.from('votes').insert({id:v.id,title:v.title,options:opts,votes:{}});if(vr.error)return alert(vr.error.message)}else data.votes.unshift(v);poll={vote_id:v.id,title:v.title,options:opts,votes:{}}}let n={id:crypto.randomUUID(),title:f.get('title'),text:f.get('text'),time:new Date().toLocaleString('de-DE'),poll};if(cloudReady){let r=await sb.from('news').insert({id:n.id,title:n.title,text:n.text,time:n.time,vote_id:poll?.vote_id||null});if(r.error)return alert(r.error.message);await cloudLoad();await sendPush('📰 Neue PlayerHub-News',n.title+' – '+n.text,'news')}else{data.news.unshift(n);save()}closeModal();render()}
async function deleteNews(id){if(confirm('News löschen?')){if(cloudReady){let r=await sb.from('news').delete().eq('id',id);if(r.error)return alert(r.error.message);await cloudLoad()}else{data.news=data.news.filter(n=>n.id!==id);save()}render()}}
async function vote(vid,pid){if(cloudReady){let r=await sb.rpc('cast_vote',{p_vote_id:vid,p_option:pid});if(r.error)return alert(r.error.message);await cloudLoad();render();return}let v=data.votes.find(x=>x.id===vid);if(v.votes?.[me.id])return alert('Du hast bereits abgestimmt.');v.votes=v.votes||{};v.votes[me.id]=pid;save();render()}
async function castNews(pid,oid){let n=data.news.find(x=>x.poll?.vote_id===pid);if(cloudReady){let r=await sb.rpc('cast_vote',{p_vote_id:pid,p_option:oid});if(r.error)return alert(r.error.message);await cloudLoad();render();return}if(!n)return; n.poll.votes=n.poll.votes||{};if(n.poll.votes[me.id])return alert('Du hast bereits abgestimmt.');n.poll.votes[me.id]=oid;save();render()}
function voteForm(){openModal(`<div class="sheethead"><h2>🗳️ Abstimmung erstellen</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveVote(event)"><div class="field"><label>Frage</label><input name="title" required></div><div class="sectiontitle"><h2>Spieler</h2></div><div>${data.players.map(p=>`<label class="btn" style="display:block;margin:7px 0"><input type="checkbox" name="players" value="${p.id}"> ${esc(p.first+' '+p.last)}</label>`).join('')}</div><button class="btn primary" style="margin-top:15px;width:100%">Vote erstellen</button></form>`)}
async function saveVote(e){e.preventDefault();let f=new FormData(e.target),opts=f.getAll('players');if(opts.length<2)return alert('Mindestens zwei Spieler auswählen.');let v={id:crypto.randomUUID(),title:f.get('title'),options:opts,votes:{}};if(cloudReady){let r=await sb.from('votes').insert(v);if(r.error)return alert(r.error.message);await cloudLoad()}else{data.votes.unshift(v);save()}closeModal();render()}

async function notifyPotm(){
  if(!data.players.length)return alert('Noch keine Spieler vorhanden.');
  let winner=[...data.players].sort((a,b)=>{
    let A=calc(a),B=calc(b);return (B.ovr+B.avg*4+B.kb*.03)-(A.ovr+A.avg*4+A.kb*.03)
  })[0];
  if(!winner)return;
  let month=new Date().toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  if(!confirm(`🏆 ${winner.first} ${winner.last} als Player of the Month für ${month} festlegen und alle aktivierten Geräte benachrichtigen?`))return;
  if(cloudReady){await sendPush('🏆 Player of the Month',winner.first+' '+winner.last+' ist Player of the Month für '+month+'!','potm');alert('🏆 Player of the Month festgelegt und Push ausgelöst.')}else alert('Cloud-Push funktioniert erst nach der Firebase/Supabase-Push-Einrichtung.');
}
function userForm(){openModal(`<div class="sheethead"><h2>👤 Nutzer anlegen</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveUser(event)"><div class="field"><label>Name</label><input name="name" required></div><div class="field" style="margin-top:10px"><label>Passwort/PIN</label><input name="pin" required minlength="4"></div><div class="field" style="margin-top:10px"><label>Rolle</label><select name="role"><option value="user">Nutzer</option><option value="admin">Admin</option></select></div><button class="btn primary" style="margin-top:18px;width:100%">Account erstellen</button></form>`)}
function saveUser(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(data.users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return alert('Dieser Name existiert bereits.');data.users.push({id:'u'+Date.now(),name,pin:f.get('pin'),role:f.get('role')});save();closeModal();render()}
function deleteUser(id){if(confirm('Nutzer löschen?')){data.users=data.users.filter(u=>u.id!==id);save();render()}}
function adminLogin(){openModal(`<div class="sheethead"><h2>🔐 Admin-Login</h2><button class="close" onclick="closeModal()">×</button></div><p class="hint">Der Admin-Bereich ist nur für Administratoren.</p><form onsubmit="performAdminLogin(event)"><div class="field"><label>Admin-E-Mail</label><input name="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:10px"><label>Passwort / PIN</label><input name="pin" type="password" autocomplete="current-password" required></div><div class="field" style="margin-top:10px"><label>Admin-Code</label><input name="code" type="password" autocomplete="off" required></div><button class="btn primary" style="width:100%;margin-top:15px">Als Admin einloggen</button></form>`)}
async function performAdminLogin(e){e.preventDefault();let f=new FormData(e.target),email=String(f.get('email')||'').trim(),pin=String(f.get('pin')||''),code=String(f.get('code')||'');if(code!==ADMIN_CODE)return alert('❌ Der Admin-Code ist falsch.');if(!CLOUD.url||!CLOUD.key)return alert('Die PlayerHub-Cloud ist noch nicht eingerichtet.');let r=await cloudSignIn(email,pin);if(!r.ok)return alert('Anmeldung fehlgeschlagen:\n\n'+r.error);let loaded=await cloudLoad();if(!loaded||me?.role!=='admin'){await sb.auth.signOut();me=null;return alert('❌ Dieser Account hat keine Admin-Rechte.')}localStorage.setItem(SESSION,r.user.id);closeModal();tab='admin';render()}
async function login(e){e.preventDefault();let f=new FormData(e.target),email=String(f.get('email')||'').trim(),pin=String(f.get('pin')||'');if(cloudReady||CLOUD.url){let r=await cloudSignIn(email,pin);if(!r.ok)return alert('Anmeldung fehlgeschlagen: '+r.error);localStorage.setItem(SESSION,r.user.id);render();return}let u=data.users.find(x=>(x.email||x.name).toLowerCase()===email.toLowerCase()&&x.pin===pin);if(!u)return alert('Name oder Passwort/PIN ist falsch.');me=u;localStorage.setItem(SESSION,u.id);render()}
async function logout(){await cloudLogout();localStorage.removeItem(SESSION);me=null;tab='home';render()}
async function registerUser(){
 const email=prompt('Deine E-Mail-Adresse:'); if(!email)return;
 const name=prompt('Dein Name:'); if(!name)return;
 const pin=prompt('Passwort (mindestens 6 Zeichen):'); if(!pin)return;
 if(CLOUD.url&&CLOUD.key){let ok=await cloudSignUp(email.trim(),name.trim(),pin,false);if(!ok)return alert('Registrierung fehlgeschlagen. Prüfe E-Mail, Passwort und Cloud-Setup.');alert('Konto erstellt. Falls E-Mail-Bestätigung aktiv ist, bestätige zuerst deine E-Mail. Danach kannst du dich anmelden.');return}
 data.users.push({id:'u'+Date.now(),name:name.trim(),email:email.trim(),pin,role:'user'});save();alert('Konto erstellt. Du kannst dich jetzt anmelden.');
}
async function restore(){if(CLOUD.url&&CLOUD.key){await cloudInit();let u=await cloudLoad();if(u)return}let id=localStorage.getItem(SESSION);me=data.users.find(u=>u.id===id)||null}
function go(t){tab=t;render()}
function setup(){document.getElementById('root').innerHTML=`<div class="login"><form class="card loginbox" onsubmit="setupAdmin(event)"><div class="eyebrow">ERSTE EINRICHTUNG</div><h1>PlayerHub einrichten ⚽</h1><p class="hint">Für die echte Mannschafts-Cloud trägst du hier einmal dein Supabase-Projekt ein.</p><div class="field"><label>Supabase Project URL</label><input name="url" value="${esc(CLOUD.url)}" placeholder="https://....supabase.co"></div><div class="field" style="margin-top:10px"><label>Supabase anon public key</label><input name="key" value="${esc(CLOUD.key)}" placeholder="eyJ..."></div><div class="field" style="margin-top:10px"><label>Admin-Code</label><input name="code" type="password" placeholder="Admin-Code" required></div><div class="field" style="margin-top:10px"><label>Admin-E-Mail</label><input name="email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:10px"><label>Dein Admin-Name</label><input name="name" required autocomplete="name"></div><div class="field" style="margin-top:10px"><label>Passwort / PIN</label><input name="pin" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn primary" style="width:100%;margin-top:15px">Cloud + Admin einrichten</button><p class="hint">Admin-Code im HTML: <b>${ADMIN_CODE}</b></p><p class="hint">🔔 Push wird nach der Firebase-Konfiguration im Admin-Bereich aktiviert.</p></form></div>`}
async function setupAdmin(e){e.preventDefault();let f=new FormData(e.target);if(f.get('code')!==ADMIN_CODE)return alert('Admin-Code ist falsch.');let url=String(f.get('url')||'').trim(),key=String(f.get('key')||'').trim(),email=String(f.get('email')||'').trim(),name=String(f.get('name')||'').trim(),pin=String(f.get('pin')||'');if(url&&key){localStorage.setItem('ph_supabase_url',url);localStorage.setItem('ph_supabase_key',key);CLOUD.url=url;CLOUD.key=key;await cloudInit();let r=await cloudSignUp(email,name,pin,true);if(!r.ok)return alert('Cloud-Account konnte nicht erstellt werden.\n\n'+r.error);localStorage.setItem(SESSION,r.user.id);render();return}data.users=[{id:'admin-'+Date.now(),name,pin,role:'admin'}];save();me=data.users[0];localStorage.setItem(SESSION,me.id);render()}
function render(){if(!me){document.getElementById('root').innerHTML=`<div class="login"><form class="card loginbox" onsubmit="login(event)"><div class="eyebrow">PLAYERHUB</div><h1>Deine Spielerzentrale ⚽</h1><p class="hint">Einloggen, eingeloggt bleiben und eure Fußballprofile verwalten.</p><div class="field"><label>E-Mail</label><input name="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:10px"><label>Passwort / PIN</label><input name="pin" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;margin-top:15px">Einloggen</button><button type="button" class="btn" style="width:100%;margin-top:9px" onclick="registerUser()">🆕 Neues Konto erstellen</button><button type="button" class="btn" style="width:100%;margin-top:9px" onclick="adminLogin()">🔐 Admin-Login</button><p class="hint" style="margin-top:15px">Normale Nutzer brauchen nur ihr eigenes Konto. Der Admin-Bereich ist separat geschützt.</p></form></div>`;return}if(tab==='admin'&&me.role!=='admin')tab='home';let content=tab==='home'?home():tab==='players'?players():tab==='news'?`<div class="hero"><div class="eyebrow">UPDATES</div><h1>News</h1><p>Alles rund um eure Mannschaft.</p></div>${newsList()}`:tab==='votes'?votes():admin();document.getElementById('root').innerHTML=`<div class="app">${header()}<main class="main">${content}</main>${nav()}</div>`}
(async()=>{await restore();render()})();
</script></body></html>
