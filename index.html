function authErr(m){m=String(m||'');let l=m.toLowerCase();if(l.includes('invalid login'))return 'E-Mail oder Passwort ist falsch.';if(l.includes('not confirmed'))return 'Bitte bestätige zuerst deine E-Mail-Adresse (Link im Postfach).';if(l.includes('already registered'))return 'Diese E-Mail ist bereits registriert.';if(l.includes('password should be'))return 'Das Passwort ist zu kurz (mindestens 6 Zeichen).';if(l.includes('rate limit'))return 'Zu viele Versuche. Bitte warte kurz und versuche es erneut.';if(l.includes('failed to fetch')||l.includes('network'))return 'Keine Verbindung zum Server. Prüfe deine Internetverbindung.';return m||'Unbekannter Fehler.'}
async function cloudInit(){
 if(!CLOUD.url||!CLOUD.key)return false;

 if(!window.supabase){await new Promise((res,rej)=>{let x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';x.onload=res;x.onerror=rej;document.head.appendChild(x)})}

function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isStandalone(){return window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches}
function pushSupported(){return 'Notification'in window&&'serviceWorker'in navigator&&'PushManager'in window}
function pushEnabled(){return localStorage.getItem('playerhub_push_enabled')==='1'&&pushSupported()&&Notification.permission==='granted'}
function pushHint(){if(isIOS()&&!isStandalone())return 'Auf dem iPhone: In Safari „Teilen → Zum Home-Bildschirm“ wählen, PlayerHub von dort öffnen und dann hier aktivieren.';if(!pushSupported())return 'Dieses Gerät oder dieser Browser unterstützt keine Web-Push-Benachrichtigungen.';if(Notification.permission==='denied')return 'Benachrichtigungen sind blockiert. Erlaube sie in den Geräte- oder Browsereinstellungen.';return 'Erhalte News und Player-of-the-Month-Updates direkt aufs Gerät.'}
function registerSW(){if(!('serviceWorker'in navigator))return Promise.resolve(null);return navigator.serviceWorker.register('firebase-messaging-sw.js',{scope:'./'}).catch(e=>{console.warn('Service Worker:',e&&e.message);return null})}
function ensureMessaging(){if(!window.firebase)throw new Error('Firebase konnte nicht geladen werden.');if(!firebaseApp){firebaseApp=firebase.initializeApp(FIREBASE_CONFIG);messaging=firebase.messaging();messaging.onMessage(p=>toast(p.data?.title||p.notification?.title||'PlayerHub',p.data?.body||p.notification?.body||''))}return messaging}
async function initPush(){return once('push',async()=>{try{
 if(!me||!cloudReady)throw new Error('Bitte zuerst einloggen.');
 if(isIOS()&&!isStandalone())throw new Error('Auf dem iPhone funktioniert Push nur in der installierten App: Safari → Teilen → „Zum Home-Bildschirm“, dann PlayerHub vom Home-Bildschirm öffnen und erneut aktivieren.');
 if(!pushSupported())throw new Error('Dieses Gerät oder dieser Browser unterstützt keine Web-Push-Benachrichtigungen.');
 if(Notification.permission==='denied')throw new Error('Benachrichtigungen sind blockiert. Bitte in den Geräte- oder Browsereinstellungen erlauben.');
 let permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
 if(permission!=='granted')throw new Error('Push-Benachrichtigungen wurden nicht erlaubt.');
 let msg=ensureMessaging();let registration=await registerSW();if(!registration)throw new Error('Service Worker konnte nicht registriert werden.');
 await navigator.serviceWorker.ready;
 let token=await msg.getToken({vapidKey:FCM_VAPID_KEY,serviceWorkerRegistration:registration});if(!token)throw new Error('Firebase konnte kein Push-Token erstellen.');
 let r=await sb.rpc('save_push_subscription',{p_token:token,p_platform:isIOS()?'ios-pwa':'web'});if(r.error)throw new Error('Gerät konnte nicht gespeichert werden: '+r.error.message);
 pushToken=token;localStorage.setItem('playerhub_push_enabled','1');localStorage.setItem('playerhub_push_token',token);render();
 alert('✅ Berechtigung erteilt und Gerät registriert.\n\nHinweis: Das heißt noch nicht, dass Nachrichten ankommen. Admins können unter „Verwaltung“ eine Testnachricht senden.');return true}
catch(e){console.error('Push-Aktivierung fehlgeschlagen:',e&&e.message);alert('Push konnte nicht aktiviert werden.\n\n'+(e&&e.message||e));return false}})}
async function removePushDevice(){try{let t=localStorage.getItem('playerhub_push_token');if(t&&sb)await sb.rpc('remove_push_subscription',{p_token:t})}catch(e){console.warn('Push-Gerät entfernen:',e&&e.message)}localStorage.removeItem('playerhub_push_enabled');localStorage.removeItem('playerhub_push_token')}

async function cloudLoad(){if(!cloudReady)return false;
 let u=await cloudSession();if(!u)return false;
  let pr=await sb.from('profiles').select('id,display_name,role').eq('id',u.id).single();if(pr.error||!pr.data){console.error('Profil laden:',pr.error&&pr.error.message);return false}
 me={id:u.id,name:pr.data.display_name||u.email,role:pr.data.role==='admin'?'admin':'user',email:u.email};
 let us=await sb.from('profiles').select('id,display_name,role'); data.users=(us.data||[]).map(x=>({id:x.id,name:x.display_name,email:'',role:x.role||'user'}));
 let [ps,ns,vs]=await Promise.all([sb.from('players').select('*').order('created_at',{ascending:false}),sb.from('news').select('*').order('created_at',{ascending:false}),sb.from('votes').select('*').order('created_at',{ascending:false})]);
 if(ps.error||ns.error||vs.error)return false;
 data.players=(ps.data||[]).map(x=>({id:x.id,first:x.first_name,last:x.last_name,pos:x.position||'',foot:x.strong_foot||'',num:x.number||0,age:x.age||0,img:x.image_url||'',games:x.games||0,goals:x.goals||0,assists:x.assists||0,shots:x.shots||0,onTarget:x.shots_on_target||0,yellow:x.yellow||0,red:x.red||0,saves:x.saves||0,clean:x.clean_sheets||0,ratings:x.ratings||[],injured:x.injured||false,injury:x.injury||'',suspended:x.suspended||false,suspReason:x.suspension_reason||''}));
 data.votes=(vs.data||[]); data.news=(ns.data||[]).map(n=>{let v=data.votes.find(x=>x.id===n.vote_id);return {...n,poll:v?{vote_id:v.id,id:v.id,title:v.title,options:(v.options||[]).map((x,i)=>({id:x,label:x})),votes:v.votes||{}}:null}});return true;
}
async function cloudSignIn(email,pw){if(!await cloudInit())return {ok:false,error:'Cloud konnte nicht geladen werden.'};let r=await sb.auth.signInWithPassword({email,password:pw});if(r.error)return {ok:false,error:authErr(r.error.message)};let loaded=await cloudLoad();if(!loaded){await sb.auth.signOut();return {ok:false,error:'Anmeldung erfolgreich, aber dein Profil konnte nicht geladen werden. Bitte versuche es erneut oder melde dich beim Admin.'}}return {ok:true,user:r.data.user}}
async function cloudSignUp(email,name,pw){if(!await cloudInit())return {ok:false,error:'Cloud konnte nicht geladen werden.'};
 let r=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});
 if(r.error)return {ok:false,error:authErr(r.error.message)};
 if(r.data?.user&&Array.isArray(r.data.user.identities)&&r.data.user.identities.length===0)return {ok:false,error:'Diese E-Mail ist bereits registriert. Bitte melde dich an oder setze dein Passwort zurück.'};

 let loaded=await cloudLoad();if(!loaded)return {ok:false,error:'Konto erstellt, aber das Profil konnte nicht geladen werden. Bitte melde dich erneut an.'};
 return {ok:true,user:r.data.user}}

function enablePush(){return initPush()}
/* Ergebnis des Versands: ok=false bei Fehler. accepted = vom Push-Dienst (FCM) angenommen. Das ist NICHT gleich "auf dem Gerät angezeigt". */
async function sendPush(title,body,type='general',opts={}){
  if(!cloudReady||!me||me.role!=='admin')return {ok:false,error:'Nur Admins dürfen Push senden.'};
  try{
    let {data:sd}=await sb.auth.getSession();let token=sd?.session?.access_token;if(!token)return {ok:false,error:'Sitzung abgelaufen. Bitte neu einloggen.'};
    let r=await fetch(CLOUD.url+'/functions/v1/send-push',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':CLOUD.key},body:JSON.stringify({title,body,type,...opts})});
    let j=await r.json().catch(()=>({}));
    if(!r.ok||j.success===false)return {ok:false,error:j.error||('Server antwortete mit '+r.status)};
    return {ok:true,...j};
  }catch(e){console.warn('Push senden:',e&&e.message);return {ok:false,error:authErr(e&&e.message)}}
}
function pushSummary(r){if(!r.ok)return 'Push fehlgeschlagen: '+r.error;if(!r.attempted)return 'Es ist noch kein Gerät für Push registriert.';return 'Push übergeben: '+r.accepted+' von '+r.attempted+' Geräten vom Push-Dienst angenommen'+(r.failed?', '+r.failed+' fehlgeschlagen':'')+(r.removed?', '+r.removed+' ungültige Geräte entfernt':'')+'.\nHinweis: „Angenommen“ bedeutet nicht, dass die Nachricht schon angezeigt wurde.'}
async function pushTest(){return once('pushtest',async()=>{if(!pushEnabled())return alert('Dieses Gerät ist noch nicht registriert. Erst „Push aktivieren“ tippen.');let r=await sendPush('🔔 PlayerHub Test','Testnachricht an dein Gerät – '+new Date().toLocaleTimeString('de-DE'),'test',{target:'self'});alert(pushSummary(r)+(r.ok&&r.accepted?'\n\nTipp: Nachrichten erscheinen als Systemmeldung, wenn die App im Hintergrund ist. In der geöffneten App siehst du einen Banner.':''))})}
function pushTile(){return `<div class="section"><div class="card"><div class="row between"><div><b>🔔 Push-Benachrichtigungen</b><div class="meta">${esc(pushHint())}</div></div><div class="row"><button class="btn primary small" onclick="enablePush()">${pushEnabled()?'Neu registrieren':'Aktivieren'}</button><button class="btn small" onclick="pushTest()">Test senden</button></div></div></div></div>`}
function calc(p){let avg=p.ratings.length?p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length:6;let recent=p.ratings.length?p.ratings[p.ratings.length-1]:avg;let base=20+Math.min(35,avg*4.2)+Math.min(12,p.games*.45)+Math.min(15,p.goals*2.2)+Math.min(10,p.assists*1.4)+Math.min(6,p.shots*.18)-p.yellow*.7-p.red*3-(p.suspended?2:0);if(p.pos==='TW')base+=Math.min(12,p.saves*.45)+Math.min(8,p.clean*1.2);else base+=Math.min(7,p.onTarget*.3);let ovr=Math.max(20,Math.min(99,Math.round(base)));let kb=Math.max(0,Math.round(p.games*5+p.goals*15+p.assists*9+p.shots*1.2+p.onTarget*2+(p.pos==='TW'?p.saves*1.8+p.clean*5:0)+avg*4-p.yellow*3-p.red*12-(p.suspended?8:0)));return{avg,recent,ovr,kb}}
function status(p){if(p.injured)return `<span class="pill red">🔴 Verletzt${p.injury?' · '+esc(p.injury):''}</span>`;if(p.suspended)return `<span class="pill red">🟥 Gesperrt${p.suspReason?' · '+esc(p.suspReason):''}</span>`;return '<span class="pill green">🟢 Fit</span>'}
function header(){return `<header class="top"><div class="toprow between"><div class="brand">Player<span>Hub</span> ⚽</div><div class="row"><span class="meta">${esc(me.name)}</span><button class="btn small" onclick="logout()">Logout</button></div></div></header>`}

function pushCard(){const enabled=pushEnabled();return `<div class="card" style="margin-bottom:18px"><div class="row between"><div><div class="eyebrow">BENACHRICHTIGUNGEN</div><h2 style="margin:5px 0">🔔 PlayerHub Push</h2><p class="hint">${enabled?'Dieses Gerät ist für Push registriert.':pushHint()}</p></div>${enabled?'<span class="pill green">🟢 Registriert</span>':'<button class="btn primary" onclick="initPush()">Push aktivieren</button>'}</div></div>`}
function home(){let top=[...data.players].sort((a,b)=>calc(b).ovr-calc(a).ovr).slice(0,3);return `${pushCard()}<section class="hero"><div class="eyebrow">PLAYERZENTRALE</div><h1>Alles über eure Spieler.</h1><p>Form, Leistungen, News und Abstimmungen an einem Ort.</p></section><div class="grid3">${top.map(playerCard).join('')||'<div class="card"><b>Noch keine Spieler</b><p class="hint">Im Admin-Bereich kannst du die ersten Profile anlegen.</p></div>'}</div><div class="section"><div class="sectiontitle"><h2>📰 Neueste News</h2><button class="btn small" onclick="go('news')">Alle</button></div>${newsList(3)}</div><div class="section"><div class="sectiontitle"><h2>🏆 Player of the Month</h2></div>${monthBox()}</div>`}
function playerCard(p){let c=calc(p);return `<div class="card playerCard" onclick="profile('${p.id}')"><div class="playerHero">${p.img?`<img src="${esc(p.img)}" alt="">`:''}<div class="playerOverlay"><div class="eyebrow">#${p.num} · ${esc(p.pos)}</div><div class="name">${esc(p.first+' '+p.last)}</div><div class="row"><span class="pill">OVR ${c.ovr}</span><span class="pill">Form ${c.recent.toFixed(1)}</span></div></div></div><div style="padding:13px"><div class="row between"><span>${status(p)}</span><b>${c.kb} PKT</b></div></div></div>`}
function players(){return `<div class="hero"><div class="eyebrow">KADER</div><h1>Spieler</h1><p>Jedes Profil wird aus den eingetragenen Daten automatisch berechnet.</p></div><div class="grid">${data.players.map(playerCard).join('')||'<div class="card"><p class="hint">Noch keine Spieler angelegt.</p></div>'}</div>`}
function profile(id){let p=data.players.find(x=>x.id===id);if(!p)return;let c=calc(p);document.getElementById('root').innerHTML=header()+`<main class="main"><button class="btn" onclick="go('players')">← Zurück</button><div class="card" style="margin-top:14px;padding:0;overflow:hidden"><div class="playerHero" style="height:340px">${p.img?`<img src="${esc(p.img)}" alt="">`:''}<div class="playerOverlay"><div class="eyebrow">#${p.num} · ${esc(p.pos)} · ${esc(p.foot)} Fuß</div><div class="name" style="font-size:34px">${esc(p.first)}<br>${esc(p.last)}</div><div class="row" style="margin-top:9px"><span class="pill">${p.age} Jahre</span>${status(p)}</div></div></div><div style="padding:18px"><div class="grid"><div class="card"><div class="eyebrow">OVERALL</div><div class="ovr"><div class="ovrnum">${c.ovr}</div><div style="flex:1"><div class="bar"><span style="width:${c.ovr}%"></span></div><p class="meta">Automatisch aus Leistungsdaten</p></div></div></div><div class="card"><div class="eyebrow">FORM</div><div class="ovrnum">${c.recent.toFixed(1)}<span class="meta" style="font-size:16px"> / 10</span></div><p class="meta">Ø ${c.avg.toFixed(1)} aus ${p.ratings.length} Bewertungen</p></div></div><div class="sectiontitle"><h2>📊 Saison</h2></div><div class="metricGrid"><div class="metric"><b>${p.games}</b><span>Spiele</span></div><div class="metric"><b>${p.goals}</b><span>Tore</span></div><div class="metric"><b>${p.assists}</b><span>Vorlagen</span></div><div class="metric"><b>${p.shots}</b><span>Schüsse</span></div><div class="metric"><b>${p.onTarget}</b><span>Aufs Tor</span></div><div class="metric"><b>${c.kb}</b><span>Kickbase-Punkte</span></div>${p.pos==='TW'?`<div class="metric"><b>${p.saves}</b><span>Paraden</span></div><div class="metric"><b>${p.clean}</b><span>Zu Null</span></div>`:''}<div class="metric"><b>${p.yellow}</b><span>Gelbe Karten</span></div><div class="metric"><b>${p.red}</b><span>Rote Karten</span></div></div><div class="sectiontitle"><h2>⭐ Spielbewertungen</h2></div><div class="ratingRow">${p.ratings.length?p.ratings.map(x=>`<div class="ratingDot">${Number(x).toFixed(1)}</div>`).join(''):'<span class="hint">Noch keine Bewertungen.</span>'}</div><div class="sectiontitle"><h2>🩺 Verfügbarkeit</h2></div><div class="card">${status(p)}${p.suspended&&p.suspReason?`<p class="hint">Sperrgrund: ${esc(p.suspReason)}</p>`:''}</div></div></div></div>${nav()}`}
function newsList(limit){let arr=limit?data.news.slice(0,limit):data.news;return arr.map(n=>`<article class="card news" style="margin-bottom:12px"><div class="eyebrow">${esc(n.time)}</div><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>${n.poll?pollHTML(n):''}${me.role==='admin'?`<button class="btn danger small" onclick="deleteNews('${n.id}')">News löschen</button>`:''}</article>`).join('')||'<div class="card"><p class="hint">Noch keine News.</p></div>'}
function pollHTML(n){let v=n.poll, votes=v.votes||{},total=Object.keys(votes).length;return `<div class="vote"><b>🗳️ ${esc(v.title)}</b>${v.options.map(o=>{let count=Object.values(votes).filter(x=>x===o.id).length,pct=total?Math.round(count/total*100):0;return `<button class="btn" onclick="castNews('${v.id}','${o.id}')">${esc(o.label)} <span style="float:right">${pct}%</span><div class="voteResult"><span style="width:${pct}%"></span></div></button>`}).join('')}<small class="meta">${total} Stimme${total===1?'':'n'}</small></div>`}
function votes(){return `<div class="hero"><div class="eyebrow">COMMUNITY</div><h1>Abstimmungen</h1><p>Jeder eingeloggte Nutzer kann pro Abstimmung einmal abstimmen.</p></div>${data.votes.map(v=>voteHTML(v)).join('')||'<div class="card"><p class="hint">Noch keine Abstimmungen.</p></div>'}<div class="section"><h2>🏆 Player of the Month</h2>${monthBox()}</div>`}
function voteHTML(v){let total=Object.keys(v.votes||{}).length;return `<div class="card" style="margin-bottom:12px"><div class="eyebrow">ABSTIMMUNG</div><h3>${esc(v.title)}</h3>${v.options.map(id=>{let p=data.players.find(x=>x.id===id);if(!p)return '';let count=Object.values(v.votes||{}).filter(x=>x===id).length,pct=total?Math.round(count/total*100):0;return `<button class="btn" style="width:100%;margin-top:7px" onclick="vote('${v.id}','${id}')">${esc(p.first+' '+p.last)} <span style="float:right">${pct}%</span><div class="voteResult"><span style="width:${pct}%"></span></div></button>`}).join('')}<small class="meta">${total} Stimme${total===1?'':'n'}</small></div>`}
function monthBox(){let scores=data.players.map(p=>{let c=calc(p);return{p,c,score:Math.round(c.ovr*.45+c.avg*5+c.kb*.12)}}).sort((a,b)=>b.score-a.score);let top=scores[0];if(!top)return '<div class="card"><p class="hint">Noch keine Spieler.</p></div>';return `<div class="card"><div class="row between"><div><div class="eyebrow">AKTUELLER PERFORMANCE-SCORE</div><h2 style="margin:5px 0">🏆 ${esc(top.p.first+' '+top.p.last)}</h2><p class="hint">Score ${top.score}/100 · OVR ${top.c.ovr} · Ø Form ${top.c.avg.toFixed(1)}</p></div><b class="gold" style="font-size:30px">${top.score}</b></div></div>`}
function admin(){return pushTile()+`<div class="hero"><div class="eyebrow">ADMIN</div><h1>Verwaltung</h1><p>Nur Administratoren können Inhalte und Spielerwerte verändern.</p></div><div class="adminGrid"><div class="adminTile" onclick="playerForm()">➕<br><b>Spieler</b><br><span class="meta">Profil erstellen</span></div><div class="adminTile" onclick="newsForm()">📰<br><b>News</b><br><span class="meta">News + Vote erstellen</span></div><div class="adminTile" onclick="voteForm()">🗳️<br><b>Abstimmung</b><br><span class="meta">Community-Vote</span></div><div class="adminTile" onclick="notifyPotm()">🏆<br><b>Player of the Month</b><br><span class="meta">Push an alle Geräte</span></div></div><div class="section"><div class="sectiontitle"><h2>👥 Spieler verwalten</h2></div>${data.players.map(p=>`<div class="card" style="margin-bottom:10px"><div class="row between"><div><b>${esc(p.first+' '+p.last)}</b><div class="meta">${esc(p.pos)} · OVR ${calc(p).ovr}</div></div><button class="btn small" onclick="playerForm('${p.id}')">Bearbeiten</button></div></div>`).join('')||'<p class="hint">Noch keine Spieler.</p>'}</div><div class="section"><div class="sectiontitle"><h2>🔐 Nutzer</h2></div><p class="hint">Rollen werden bewusst nur serverseitig in Supabase vergeben, nicht in der App.</p>${data.users.map(u=>`<div class="card" style="margin-bottom:8px"><div class="row between"><span><b>${esc(u.name)}</b> <span class="pill">${esc(u.role)}</span></span></div></div>`).join('')}</div>`}
function openModal(html){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(m)}function closeModal(){document.querySelector('.modal')?.remove()}
function playerForm(id){let p=id?data.players.find(x=>x.id===id):{id:crypto.randomUUID(),first:'',last:'',pos:'ST',foot:'Rechts',num:9,age:14,img:'',games:0,goals:0,assists:0,shots:0,onTarget:0,yellow:0,red:0,suspended:false,suspReason:'',injured:false,injury:'',ratings:[],saves:0,clean:0};openModal(`<div class="sheethead"><h2>${id?'Spieler bearbeiten':'Spieler hinzufügen'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePlayer(event,'${p.id}',${!!id})"><div class="formgrid"><div class="field"><label>Vorname</label><input name="first" value="${esc(p.first)}" required></div><div class="field"><label>Nachname</label><input name="last" value="${esc(p.last)}" required></div><div class="field"><label>Position</label><select name="pos">${['TW','IV','AV','ZM','ZOM','RM','LM','ST'].map(x=>`<option ${p.pos===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Nummer</label><input name="num" type="number" min="0" max="99" step="1" value="${p.num}"></div><div class="field"><label>Alter</label><input name="age" type="number" min="5" max="99" step="1" value="${p.age}"></div><div class="field"><label>Starker Fuß</label><select name="foot">${['Rechts','Links','Beide'].map(x=>`<option ${p.foot===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="sectiontitle"><h2>📸 Profilbild</h2></div><input name="img" id="imgfile" type="file" accept="image/*" onchange="previewImage(event)"><div id="imgprev" style="margin-top:10px">${p.img?`<img class="photoPreview" src="${esc(p.img)}">`:''}</div><div class="sectiontitle"><h2>📊 Leistungsdaten</h2></div><div class="formgrid">${[['games','Spiele'],['goals','Tore'],['assists','Vorlagen'],['shots','Schüsse'],['onTarget','Schüsse aufs Tor'],['yellow','Gelbe Karten'],['red','Rote Karten'],['saves','Paraden (TW)'],['clean','Zu Null (TW)']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" type="number" min="0" step="1" value="${p[k]||0}"></div>`).join('')}</div><div class="sectiontitle"><h2>🩺 Status</h2></div><div class="formgrid"><div class="field"><label>Verletzt?</label><select name="injured"><option value="0" ${!p.injured?'selected':''}>Nein</option><option value="1" ${p.injured?'selected':''}>Ja</option></select></div><div class="field"><label>Verletzung</label><input name="injury" value="${esc(p.injury)}" placeholder="z. B. Sprunggelenk"></div><div class="field"><label>Gesperrt?</label><select name="suspended"><option value="0" ${!p.suspended?'selected':''}>Nein</option><option value="1" ${p.suspended?'selected':''}>Ja</option></select></div><div class="field"><label>Sperrgrund</label><input name="suspReason" value="${esc(p.suspReason)}" placeholder="z. B. 5. Gelbe Karte"></div></div><div class="sectiontitle"><h2>⭐ Bewertungen</h2></div><div class="field"><label>Letzte Bewertungen, Komma-getrennt, 0,1–10</label><input name="ratings" value="${p.ratings.join(', ')}" placeholder="7.2, 8.1, 9.0"></div><button class="btn primary" style="margin-top:18px;width:100%">Speichern & automatisch berechnen</button>${id?`<button type="button" class="btn danger" style="margin-top:8px;width:100%" onclick="deletePlayer('${p.id}')">Spieler löschen</button>`:''}</form>`)}
function previewImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>document.getElementById('imgprev').innerHTML=`<img class="photoPreview" src="${r.result}">`;r.readAsDataURL(f)}
function compress(file,cb){let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(file)}
async function savePlayer(e,id,editing){e.preventDefault();return once('savePlayer',async()=>{
 let f=new FormData(e.target),old=data.players.find(x=>x.id===id),p={...(old||{}),id};
 let first=String(f.get('first')||'').trim(),last=String(f.get('last')||'').trim();if(!first||!last)return alert('Vor- und Nachname sind Pflicht.');
 p.first=first;p.last=last;p.pos=String(f.get('pos'));p.foot=String(f.get('foot'));p.injury=String(f.get('injury')||'').trim();p.suspReason=String(f.get('suspReason')||'').trim();
 let bad=[];['num','age','games','goals','assists','shots','onTarget','yellow','red','saves','clean'].forEach(k=>{let v=Number(f.get(k)||0);if(!Number.isInteger(v)||v<0)bad.push(k);p[k]=v});
 if(bad.length)return alert('Bitte nur ganze Zahlen ab 0 eintragen ('+bad.join(', ')+').');
 if(p.num>99)return alert('Rückennummer: 0–99.');if(p.age<5||p.age>99)return alert('Alter: 5–99.');
 if(p.onTarget>p.shots)return alert('Schüsse aufs Tor dürfen nicht höher sein als Schüsse insgesamt.');
 p.injured=f.get('injured')==='1';p.suspended=f.get('suspended')==='1';
 let rt=String(f.get('ratings')||'').split(',').map(x=>x.trim().replace(',','.')).filter(x=>x!=='');let rn=rt.map(Number);
 if(rn.some(x=>!isFinite(x)||x<=0||x>10))return alert('Bewertungen müssen Zahlen zwischen 0,1 und 10 sein, getrennt durch Komma.');p.ratings=rn;
 let file=document.getElementById('imgfile').files[0];
 let src=null;if(file){if(!/^image\//.test(file.type))return alert('Bitte eine Bilddatei wählen.');src=await new Promise(res=>compress(file,res))}
 if(src)p.img=src;
 let row={id:p.id,first_name:p.first,last_name:p.last,position:p.pos,strong_foot:p.foot,number:p.num,age:p.age,image_url:p.img||null,games:p.games,goals:p.goals,assists:p.assists,shots:p.shots,shots_on_target:p.onTarget,yellow:p.yellow,red:p.red,saves:p.saves,clean_sheets:p.clean,ratings:p.ratings,injured:p.injured,injury:p.injury,suspended:p.suspended,suspension_reason:p.suspReason};
 let r=await sb.from('players').upsert(row);if(r.error)return alert('Speichern fehlgeschlagen: '+r.error.message);
 if(!await cloudLoad())return alert('Gespeichert, aber die Daten konnten nicht neu geladen werden.');closeModal();render()})}
async function deletePlayer(id){if(!confirm('Spieler wirklich löschen?'))return;return once('delPlayer',async()=>{let r=await sb.from('players').delete().eq('id',id);if(r.error)return alert('Löschen fehlgeschlagen: '+r.error.message);await cloudLoad();closeModal();render()})}
function newsForm(){openModal(`<div class="sheethead"><h2>📰 News erstellen</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveNews(event)"><div class="field"><label>Überschrift</label><input name="title" required></div><div class="field" style="margin-top:10px"><label>Nachricht</label><textarea name="text" required></textarea></div><div class="sectiontitle"><h2>🗳️ Abstimmung einfügen?</h2></div><select name="poll"><option value="0">Keine Abstimmung</option><option value="1">Ja, Abstimmung anhängen</option></select><div class="field" style="margin-top:10px"><label>Frage</label><input name="polltitle" placeholder="Wer war Spieler des Spiels?"></div><div class="field" style="margin-top:10px"><label>Antworten</label><input name="pollopts" placeholder="Heinze, Hüller, Wachowski"></div><button class="btn primary" style="margin-top:18px;width:100%">Veröffentlichen</button></form>`)}
async function saveNews(e){e.preventDefault();return once('saveNews',async()=>{
 let f=new FormData(e.target),title=String(f.get('title')||'').trim(),text=String(f.get('text')||'').trim();if(!title||!text)return alert('Überschrift und Nachricht sind Pflicht.');
 let voteId=null;
 if(f.get('poll')==='1'){let opts=[...new Set(String(f.get('pollopts')||'').split(',').map(x=>x.trim()).filter(Boolean))];if(opts.length<2)return alert('Bitte mindestens zwei verschiedene Antworten eintragen.');voteId=crypto.randomUUID();let vr=await sb.from('votes').insert({id:voteId,title:String(f.get('polltitle')||'').trim()||'Abstimmung',options:opts,votes:{}});if(vr.error)return alert('Umfrage konnte nicht gespeichert werden: '+vr.error.message)}
 let id=crypto.randomUUID();let r=await sb.from('news').insert({id,title,text,time:new Date().toLocaleString('de-DE'),vote_id:voteId});
 if(r.error){if(voteId)await sb.from('votes').delete().eq('id',voteId);return alert('News konnte nicht veröffentlicht werden: '+r.error.message)}
 await cloudLoad();closeModal();render();
 let pr=await sendPush('📰 Neue PlayerHub-News',title,'news',{url:'?news='+id});
 alert('✅ News veröffentlicht (in der Datenbank gespeichert).\n\n'+pushSummary(pr))})}
async function deleteNews(id){if(!confirm('News löschen?'))return;return once('delNews',async()=>{let r=await sb.from('news').delete().eq('id',id);if(r.error)return alert('Löschen fehlgeschlagen: '+r.error.message);await cloudLoad();render()})}
async function castVote(vid,oid){return once('vote',async()=>{let r=await sb.rpc('cast_vote',{p_vote_id:vid,p_option:oid});if(r.error)return alert(r.error.message);await cloudLoad();render()})}
async function vote(vid,pid){return castVote(vid,pid)}
async function castNews(pid,oid){return castVote(pid,oid)}
function voteForm(){openModal(`<div class="sheethead"><h2>🗳️ Abstimmung erstellen</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveVote(event)"><div class="field"><label>Frage</label><input name="title" required></div><div class="sectiontitle"><h2>Spieler</h2></div><div>${data.players.map(p=>`<label class="btn" style="display:block;margin:7px 0"><input type="checkbox" name="players" value="${p.id}"> ${esc(p.first+' '+p.last)}</label>`).join('')}</div><button class="btn primary" style="margin-top:15px;width:100%">Vote erstellen</button></form>`)}
async function saveVote(e){e.preventDefault();return once('saveVote',async()=>{let f=new FormData(e.target),opts=f.getAll('players'),title=String(f.get('title')||'').trim();if(!title)return alert('Bitte eine Frage eintragen.');if(opts.length<2)return alert('Mindestens zwei Spieler auswählen.');let r=await sb.from('votes').insert({id:crypto.randomUUID(),title,options:opts,votes:{}});if(r.error)return alert('Abstimmung konnte nicht gespeichert werden: '+r.error.message);await cloudLoad();closeModal();render()})}

async function notifyPotm(){
  if(!data.players.length)return alert('Noch keine Spieler vorhanden.');
  let winner=[...data.players].sort((a,b)=>{let A=calc(a),B=calc(b);return (B.ovr+B.avg*4+B.kb*.03)-(A.ovr+A.avg*4+A.kb*.03)})[0];
  let month=new Date().toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  if(!confirm(`🏆 ${winner.first} ${winner.last} (höchster Performance-Wert) als Player of the Month für ${month} per Push ankündigen?\n\nHinweis: Das Ergebnis wird derzeit nur angekündigt, noch nicht gespeichert.`))return;
  return once('potm',async()=>{let r=await sendPush('🏆 Player of the Month',winner.first+' '+winner.last+' ist Player of the Month für '+month+'!','potm');alert(pushSummary(r))})
}
async function login(e){e.preventDefault();return once('login',async()=>{let f=new FormData(e.target),email=String(f.get('email')||'').trim(),pw=String(f.get('pin')||'');if(!email||!pw)return alert('Bitte E-Mail und Passwort eingeben.');let r=await cloudSignIn(email,pw);if(!r.ok)return alert('Anmeldung fehlgeschlagen: '+r.error);render()})}
async function logout(){await cloudLogout();me=null;data={users:[],players:[],news:[],votes:[]};tab='home';render()}
function registerForm(){openModal(`<div class="sheethead"><h2>🆕 Neues Konto</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveRegistration(event)"><div class="field"><label>Name</label><input name="name" required minlength="2" autocomplete="name"></div><div class="field" style="margin-top:10px"><label>E-Mail</label><input name="email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:10px"><label>Passwort (mind. 6 Zeichen)</label><input name="pw" type="password" required minlength="6" autocomplete="new-password"></div><button class="btn primary" style="margin-top:18px;width:100%">Konto erstellen</button></form>`)}
async function saveRegistration(e){e.preventDefault();return once('register',async()=>{let f=new FormData(e.target),name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim(),pw=String(f.get('pw')||'');if(name.length<2)return alert('Bitte einen Namen eingeben.');if(pw.length<6)return alert('Das Passwort braucht mindestens 6 Zeichen.');let r=await cloudSignUp(email,name,pw);if(!r.ok)return alert('Registrierung fehlgeschlagen: '+r.error);closeModal();if(r.needsConfirm)return alert('Konto erstellt. Bitte bestätige deine E-Mail-Adresse über den Link in deinem Postfach und melde dich danach an.');render()})}
function forgotForm(){openModal(`<div class="sheethead"><h2>🔑 Passwort zurücksetzen</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="sendReset(event)"><div class="field"><label>E-Mail</label><input name="email" type="email" required autocomplete="email"></div><button class="btn primary" style="margin-top:18px;width:100%">Link senden</button></form>`)}
async function sendReset(e){e.preventDefault();return once('reset',async()=>{let email=String(new FormData(e.target).get('email')||'').trim();if(!await cloudInit())return alert('Cloud konnte nicht geladen werden.');let r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error)return alert('Fehler: '+authErr(r.error.message));closeModal();alert('Falls ein Konto mit dieser E-Mail existiert, wurde ein Link zum Zurücksetzen gesendet.')})}
function recoveryForm(){recoveryPending=false;if(document.querySelector('.modal'))closeModal();openModal(`<div class="sheethead"><h2>🔑 Neues Passwort</h2></div><form onsubmit="saveNewPassword(event)"><div class="field"><label>Neues Passwort (mind. 6 Zeichen)</label><input name="pw" type="password" required minlength="6" autocomplete="new-password"></div><button class="btn primary" style="margin-top:18px;width:100%">Passwort speichern</button></form>`)}
async function saveNewPassword(e){e.preventDefault();return once('newpw',async()=>{let pw=String(new FormData(e.target).get('pw')||'');if(pw.length<6)return alert('Das Passwort braucht mindestens 6 Zeichen.');let r=await sb.auth.updateUser({password:pw});if(r.error)return alert('Fehler: '+authErr(r.error.message));closeModal();alert('Passwort geändert.');if(!me){await cloudLoad();render()}})}
async function restore(){try{await cloudInit();await cloudLoad()}catch(e){console.error('Sitzung wiederherstellen:',e&&e.message);me=null}}
function go(t){tab=t;render()}
function render(){if(!me){document.getElementById('root').innerHTML=`<div class="login"><form class="card loginbox" onsubmit="login(event)"><div class="eyebrow">PLAYERHUB</div><h1>Deine Spielerzentrale ⚽</h1><p class="hint">Einloggen, eingeloggt bleiben und eure Fußballprofile verwalten.</p><div class="field"><label>E-Mail</label><input name="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:10px"><label>Passwort</label><input name="pin" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;margin-top:15px">Einloggen</button><button type="button" class="btn" style="width:100%;margin-top:9px" onclick="registerForm()">🆕 Neues Konto erstellen</button><button type="button" class="linkbtn" onclick="forgotForm()">Passwort vergessen?</button><p class="hint" style="margin-top:15px">Der Admin-Bereich erscheint nach dem Login automatisch, wenn dein Konto Admin-Rechte hat.</p></form></div>`;return}if(tab==='admin'&&me.role!=='admin')tab='home';let content=tab==='home'?home():tab==='players'?players():tab==='news'?`<div class="hero"><div class="eyebrow">UPDATES</div><h1>News</h1><p>Alles rund um eure Mannschaft.</p></div>${newsList()}`:tab==='votes'?votes():admin();document.getElementById('root').innerHTML=`<div class="app">${header()}<main class="main">${content}</main>${nav()}</div>`}
(async()=>{registerSW();await restore();let nid=new URLSearchParams(location.search).get('news');if(nid&&me)tab='news';render();if(recoveryPending)recoveryForm();if(me&&pushEnabled()){try{ensureMessaging()}catch(e){console.warn('Push-Vordergrund:',e&&e.message)}}})();
</script></body></html>
