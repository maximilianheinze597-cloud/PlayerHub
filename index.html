<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>PlayerHub</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#12243a;--line:#20344c;--text:#f5f8fc;--muted:#8fa4bc;--blue:#39a7ff;--green:#38d996;--red:#ff5d70;--gold:#ffc857;--shadow:0 14px 35px #0006}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:linear-gradient(180deg,#07111f,#081423 55%,#06101d)}.top{position:sticky;top:0;z-index:20;background:#07111fee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px;letter-spacing:-.5px}.brand span{color:var(--blue)}.userpill{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),#7b61ff);font-weight:800;color:#fff}.main{max-width:1050px;margin:auto;padding:18px 16px 90px}.hero{padding:18px 0 10px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}.hero h1{font-size:32px;margin:6px 0}.hero p{color:var(--muted);margin:0}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#07111fee;backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center}.nav button{background:none;border:0;color:var(--muted);padding:10px 13px;font-size:11px;font-weight:700}.nav button.active{color:var(--blue)}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:linear-gradient(180deg,#102139,#0c1929);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.player{overflow:hidden;padding:0;cursor:pointer;transition:.18s}.player:hover{transform:translateY(-2px)}.photo{height:250px;background:linear-gradient(135deg,#19314e,#0a1421);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo .placeholder{font-size:60px;font-weight:900;color:#49657f}.pbody{padding:15px}.name{font-size:20px;font-weight:900}.meta{color:var(--muted);font-size:13px;margin-top:3px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.badge{padding:6px 9px;border-radius:999px;background:#172b42;border:1px solid #28425e;font-size:11px}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.stat{background:#091626;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:var(--muted);font-size:10px}.ovr{display:flex;align-items:center;gap:12px}.ovrnum{font-size:34px;font-weight:950}.bar{height:7px;border-radius:99px;background:#20334a;overflow:hidden;flex:1}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7b61ff);border-radius:99px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:24px 0 11px}.sectiontitle h2{margin:0;font-size:18px}.btn{border:1px solid var(--line);background:#13283f;color:var(--text);border-radius:12px;padding:10px 13px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#04111e}.btn.danger{background:#351722;border-color:#61303b;color:#ff9baa}.btn.small{padding:7px 10px;font-size:12px}.row{display:flex;gap:9px;flex-wrap:wrap}.news{display:grid;gap:10px}.news h3{margin:0 0 6px}.news p{margin:0;color:#b9c7d6;line-height:1.45}.news .time{color:var(--muted);font-size:11px;margin-top:10px}.voteopt{margin-top:8px;display:flex;align-items:center;justify-content:space-between;padding:11px;border:1px solid var(--line);border-radius:12px;background:#0a1727}.voteopt button{background:#18314b;border:1px solid #2a4866;color:#fff;border-radius:9px;padding:6px 10px}.barrow{margin-top:10px}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.formrow{display:flex;gap:7px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:6px;flex:1;min-width:140px}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;background:#091727;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;outline:none}.field textarea{min-height:100px;resize:vertical}.modal{position:fixed;inset:0;z-index:50;background:#0009;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0b1929;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px;box-shadow:0 -20px 60px #0009}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{background:#16283d;border:0;color:#fff;width:36px;height:36px;border-radius:50%}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);padding:26px}.login h1{margin-top:0}.hint{font-size:12px;color:var(--muted);line-height:1.5}.hide{display:none!important}.kpi{font-size:28px;font-weight:950}.list{display:grid;gap:10px}.mini{display:flex;align-items:center;gap:12px}.mini .avatar{flex:none}.mini strong{display:block}.mini span{color:var(--muted);font-size:12px}@media(min-width:700px){.nav{position:sticky;top:65px;border:0;background:transparent;backdrop-filter:none;justify-content:flex-start;gap:5px}.nav button{background:#0c1a2b;border:1px solid var(--line);border-radius:12px}.main{padding-bottom:30px}.modal{align-items:center}.sheet{border-radius:24px}.photo{height:280px}}

.profileHero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#102b47,#0a1524);min-height:320px}.profileHero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07111fdd 0%,#07111f55 45%,#07111f00 75%);pointer-events:none}.profilePhoto{position:absolute;right:0;top:0;width:55%;height:100%;object-fit:cover}.profileInfo{position:relative;z-index:2;padding:28px;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;width:70%}.profileName{font-size:clamp(32px,7vw,58px);line-height:.95;font-weight:950;letter-spacing:-2px;margin:8px 0}.profileNum{font-size:90px;font-weight:950;opacity:.16;position:absolute;right:25px;bottom:-10px}.metricGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#091625;border:1px solid var(--line);border-radius:15px;padding:13px}.metric b{font-size:23px;display:block}.metric span{color:var(--muted);font-size:11px}.ratingDots{display:flex;gap:7px;flex-wrap:wrap}.ratingDot{width:43px;height:43px;border-radius:12px;background:#13283f;display:grid;place-items:center;font-weight:900}.previewImg{width:100%;height:170px;object-fit:cover;border-radius:15px;margin-top:10px;border:1px solid var(--line)}.adminOnly{border-left:3px solid var(--blue);padding-left:12px}@media(max-width:650px){.profileHero{min-height:430px}.profilePhoto{width:100%;height:58%;opacity:.9}.profileInfo{width:100%;min-height:430px;padding:20px}.profileHero:after{background:linear-gradient(0deg,#07111f 5%,#07111f55 55%,#07111f00 85%)}.profileNum{font-size:70px}.metricGrid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<div id="root"></div>
<script>
const seed={
 users:[{id:'u1',name:'Admin',role:'admin',pin:'1234'},{id:'u2',name:'Maximilian',role:'user',pin:'1111'}],
 players:[
 {id:'p1',first:'Maximilian',last:'Heinze',pos:'ST',foot:'Rechts',num:6,age:14,img:'',games:18,goals:12,assists:7,shots:42,onTarget:24,yellow:2,red:0,suspended:false,suspReason:'',injured:false,injury:'',ratings:[8.1,8.7,7.6,8.9,9.0],saves:0,clean:0},
 {id:'p2',first:'Johannes',last:'Hüller',pos:'ST',foot:'Rechts',num:9,age:14,img:'',games:17,goals:10,assists:5,shots:35,onTarget:20,yellow:1,red:0,suspended:false,suspReason:'',injured:false,injury:'',ratings:[7.8,8.4,8.0,8.2,8.6],saves:0,clean:0},
 {id:'p3',first:'Leo',last:'Wachowski',pos:'IV',foot:'Rechts',num:4,age:14,img:'',games:18,goals:2,assists:3,shots:11,onTarget:5,yellow:3,red:0,suspended:false,suspReason:'',injured:false,injury:'',ratings:[7.6,7.9,8.2,8.0,8.4],saves:0,clean:0},
 {id:'p4',first:'Julian',last:'Keich',pos:'TW',foot:'Rechts',num:1,age:14,img:'',games:15,goals:0,assists:1,shots:2,onTarget:1,yellow:1,red:0,suspended:false,suspReason:'',injured:false,injury:'',ratings:[7.9,8.5,8.1,8.7,8.3],saves:61,clean:7}
 ],
 news:[{id:'n1',title:'Willkommen bei PlayerHub!',text:'Spielerprofile, Statistiken, Form, News und Abstimmungen an einem Ort.',time:'Heute',poll:null}],
 votes:[{id:'v1',title:'🏆 Player of the Month',type:'potm',options:['p1','p2','p3','p4'],votes:{},closed:false},{id:'v2',title:'🧢 Wer soll im nächsten Spiel Kapitän sein?',type:'captain',options:['p1','p2','p3','p4'],votes:{},closed:false}]
};
let data=JSON.parse(localStorage.getItem('playerhub')||'null')||seed;let me=null,tab='home';
try{const sid=localStorage.getItem('playerhub_session');if(sid)me=data.users.find(u=>u.id===sid)||null}catch(e){}
const save=()=>localStorage.setItem('playerhub',JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function calc(p){let avg=p.ratings.length?p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length:0;let form=p.ratings.length?p.ratings.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,p.ratings.length):0;let pos=p.pos;let score=55;score+=avg*4.1;score+=Math.min(18,(p.goals/Math.max(1,p.games))*18);score+=Math.min(10,(p.assists/Math.max(1,p.games))*12);score+=Math.min(7,(p.onTarget/Math.max(1,p.games))*3);score-=p.yellow*0.7+p.red*3; if(pos==='TW')score=52+avg*4.2+Math.min(18,p.saves/Math.max(1,p.games)*0.65)+Math.min(10,p.clean*1.2)-p.yellow*.7-p.red*3; if(pos==='IV'||pos==='AV')score=55+avg*4+Math.min(10,p.assists/Math.max(1,p.games)*10)+Math.min(12,p.goals/Math.max(1,p.games)*18)-p.yellow*.5-p.red*3;let ovr=Math.max(20,Math.min(99,Math.round(score)));let kb=Math.round(p.games*9+p.goals*28+p.assists*18+p.shots*1.2+p.onTarget*2+avg*18+(pos==='TW'?p.saves*1.5+p.clean*12:0)-p.yellow*8-p.red*25-(p.suspended?p.games*1.5:0));return {avg,form,ovr,kb};}
function nav(){return `<div class="nav">${[['home','🏠','Home'],['players','👥','Spieler'],['news','📰','News'],['votes','🗳️','Votes'],...(me?.role==='admin'?[['admin','⚙️','Admin']]:[])].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</div>`}
function header(){return `<header class="top"><div class="brand">Player<span>Hub</span> ⚽</div><div class="userpill"><div class="avatar">${esc(me.name[0])}</div>${esc(me.name)} <button class="btn small" onclick="logout()">Logout</button></div></header>`}
function playerCard(p){let c=calc(p);return `<div class="card player" onclick="profile('${p.id}')"><div class="photo">${p.img?`<img src="${p.img}">`:`<div class="placeholder">${esc(p.last[0])}</div>`}</div><div class="pbody"><div class="ovr"><div><div class="ovrnum">${c.ovr}</div><small style="color:var(--muted)">OVR</small></div><div style="flex:1"><div class="bar"><span style="width:${c.ovr}%"></span></div><div class="meta">${esc(p.pos)} · #${p.num} · ${esc(p.foot)}</div></div></div><div class="name">${esc(p.first)} ${esc(p.last)}</div><div class="badges"><span class="badge">🔥 Form ${c.form.toFixed(1)}</span><span class="badge">⚡ ${c.kb} KB</span>${p.injured?'<span class="badge red">🩺 Verletzung</span>':'<span class="badge green">● Fit</span>'}${p.suspended?'<span class="badge red">🟥 Gesperrt</span>':''}</div><div class="stats"><div class="stat"><b>${p.goals}</b><small>Tore</small></div><div class="stat"><b>${p.assists}</b><small>Vorlagen</small></div><div class="stat"><b>${p.shots}</b><small>Schüsse</small></div><div class="stat"><b>${p.games}</b><small>Spiele</small></div></div></div></div>`}
function home(){let top=[...data.players].sort((a,b)=>calc(b).ovr-calc(a).ovr).slice(0,3);return `<div class="hero"><div class="eyebrow">Spielerzentrale</div><h1>Dein Team. Deine Spieler. 📊</h1><p>Form, Leistung, News und Community-Abstimmungen.</p></div><div class="sectiontitle"><h2>⭐ Top-Spieler</h2><button class="btn small" onclick="go('players')">Alle Spieler</button></div><div class="grid">${top.map(playerCard).join('')}</div><div class="sectiontitle"><h2>📰 Neueste News</h2><button class="btn small" onclick="go('news')">Alle News</button></div>${newsList(2)}<div class="sectiontitle"><h2>🗳️ Aktuelle Abstimmungen</h2></div>${voteList(2)}`}
function players(){return `<div class="hero"><div class="eyebrow">Kader</div><h1>Spieler</h1><p>Tippe auf einen Spieler für das komplette Profil.</p></div><div class="grid">${data.players.map(playerCard).join('')}</div>`}
function newsList(limit=99){return `<div class="news">${data.news.slice(0,limit).map(n=>`<article class="card news"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>${n.poll?pollInline(n.poll):''}<div class="time">${esc(n.time)}</div></article>`).join('')}</div>`}
function pollInline(poll){return `<div class="card" style="padding:12px;background:#091626"><b>🗳️ ${esc(poll.title)}</b>${poll.options.map(o=>`<div class="voteopt"><span>${esc(o.label)}</span><button onclick="castNews('${poll.id}','${o.id}')">Abstimmen</button></div>`).join('')}</div>`}
function votes(){return `<div class="hero"><div class="eyebrow">Community</div><h1>Abstimmungen</h1><p>Jeder eingeloggte Nutzer kann pro Abstimmung genau einmal abstimmen.</p></div>${voteList()}`}
function voteList(limit=99){return `<div class="list">${data.votes.slice(0,limit).map(v=>{let total=Object.keys(v.votes||{}).length;return `<div class="card"><div class="sectiontitle" style="margin:0 0 8px"><h2>${esc(v.title)}</h2><span class="badge">${total} Stimme${total===1?'':'n'}</span></div>${v.options.map(id=>{let p=data.players.find(x=>x.id===id),count=Object.values(v.votes||{}).filter(x=>x===id).length,pct=total?Math.round(count/total*100):0;return `<div class="barrow"><div class="barlabel"><span>${esc(p?.first+' '+p?.last||id)}</span><b>${pct}%</b></div><div class="bar"><span style="width:${pct}%"></span></div><div class="row" style="justify-content:flex-end;margin-top:4px"><button class="btn small" onclick="vote('${v.id}','${id}')">Stimme abgeben</button></div></div>`}).join('')}</div>`}).join('')}</div>`}
function admin(){return `<div class="hero"><div class="eyebrow">Admin</div><h1>Verwaltung ⚙️</h1><p>Nur Admins können Spieler, News und Abstimmungen verwalten.</p></div><div class="grid"><div class="card"><h2>👤 Spieler</h2><p class="hint">Profil anlegen oder vorhandene Spieler bearbeiten.</p><button class="btn primary" onclick="playerForm()">+ Spieler hinzufügen</button><div class="list" style="margin-top:12px">${data.players.map(p=>`<div class="mini"><div class="avatar">${esc(p.last[0])}</div><div style="flex:1"><strong>${esc(p.first+' '+p.last)}</strong><span>${p.pos} · OVR ${calc(p).ovr}</span></div><button class="btn small" onclick="playerForm('${p.id}')">Bearbeiten</button></div>`).join('')}</div></div><div class="card"><h2>📰 News</h2><p class="hint">Eigene Meldung schreiben und optional eine Abstimmung anhängen.</p><button class="btn primary" onclick="newsForm()">+ News erstellen</button></div><div class="card"><h2>🗳️ Vote</h2><p class="hint">Neue Community-Abstimmung erstellen.</p><button class="btn primary" onclick="voteForm()">+ Abstimmung erstellen</button></div></div>`}
function profile(id){let p=data.players.find(x=>x.id===id);if(!p)return;let c=calc(p);let status=p.injured?`<span class="badge red">🔴 ${esc(p.injury||'Verletzt')}</span>`:`<span class="badge green">🟢 Fit</span>`;let suspension=p.suspended?`<span class="badge red">🟥 ${esc(p.suspReason||'Gesperrt')}</span>`:`<span class="badge green">🟢 Keine Sperre</span>`;openModal(`<div class="sheet" style="padding:0;max-height:96vh"><div class="sheethead" style="padding:16px 18px;margin:0;position:sticky;top:0;background:#0b1929ee;backdrop-filter:blur(15px);z-index:3"><div><div class="eyebrow">PROFISPIELER-PROFIL</div><strong>${esc(p.first+' '+p.last)}</strong></div><button class="close" onclick="closeModal()">×</button></div><div style="padding:0 18px 22px"><div class="profileHero">${p.img?`<img class="profilePhoto" src="${p.img}" alt="Spielerbild">`:''}<div class="profileInfo"><div class="eyebrow">#${p.num} · ${esc(p.pos)}</div><div class="profileName">${esc(p.first)}<br>${esc(p.last)}</div><div class="meta">${p.age} Jahre · ${esc(p.foot)} Fuß</div><div class="badges">${status}${suspension}</div></div><div class="profileNum">${p.num}</div></div><div class="grid" style="margin-top:12px"><div class="card"><div class="eyebrow">OVERALL</div><div class="ovr"><div class="ovrnum">${c.ovr}</div><div style="flex:1"><div class="bar"><span style="width:${c.ovr}%"></span></div><div class="meta">Automatisch berechnet</div></div></div></div><div class="card"><div class="eyebrow">FORM</div><div class="kpi">${c.form.toFixed(1)} <span class="meta">/ 10</span></div><div class="meta">Durchschnitt: ${c.avg.toFixed(1)}</div></div></div><div class="sectiontitle"><h2>📊 Leistungszentrum</h2></div><div class="metricGrid"><div class="metric"><b>${p.games}</b><span>Einsätze</span></div><div class="metric"><b>${p.goals}</b><span>Tore</span></div><div class="metric"><b>${p.assists}</b><span>Vorlagen</span></div><div class="metric"><b>${p.shots}</b><span>Schüsse</span></div><div class="metric"><b>${p.onTarget}</b><span>Schüsse aufs Tor</span></div><div class="metric"><b>${c.kb}</b><span>Kickbase-artige Punkte</span></div>${p.pos==='TW'?`<div class="metric"><b>${p.saves}</b><span>Paraden</span></div><div class="metric"><b>${p.clean}</b><span>Zu-Null-Spiele</span></div>`:''}<div class="metric"><b>${p.yellow}</b><span>Gelbe Karten</span></div><div class="metric"><b>${p.red}</b><span>Rote Karten</span></div></div><div class="sectiontitle"><h2>⭐ Letzte Bewertungen</h2></div><div class="card"><div class="ratingDots">${p.ratings.length?p.ratings.map((r,i)=>`<div class="ratingDot">${Number(r).toFixed(1)}</div>`).join(''):'<span class="hint">Noch keine Bewertungen eingetragen.</span>'}</div></div><div class="sectiontitle"><h2>🩺 Verfügbarkeit</h2></div><div class="card"><div class="badges">${status}${suspension}</div><p class="hint">Karten: 🟨 ${p.yellow} · 🟥 ${p.red}</p></div><div class="sectiontitle"><h2>🏅 Leistungsprofil</h2></div><div class="card"><p class="hint">Das OVR wird aus Form, Einsätzen, Toren, Vorlagen, Schüssen, Karten und positionsabhängigen Werten berechnet.</p><div class="row"><span class="badge">OVR ${c.ovr}</span><span class="badge">Form ${c.form.toFixed(1)}</span><span class="badge">Ø ${c.avg.toFixed(1)}</span><span class="badge">${c.kb} Punkte</span></div></div></div></div>`)}
function playerForm(id){let p=id?data.players.find(x=>x.id===id):{id:'p'+Date.now(),first:'',last:'',pos:'ST',foot:'Rechts',num:1,age:14,img:'',games:0,goals:0,assists:0,shots:0,onTarget:0,yellow:0,red:0,suspended:false,suspReason:'',injured:false,injury:'',ratings:[],saves:0,clean:0};openModal(`<div class="sheethead"><h2>${id?'Spieler bearbeiten':'Spieler hinzufügen'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePlayer(event,'${p.id}',${!!id})"><div class="grid"><div class="field"><label>Vorname</label><input name="first" value="${esc(p.first)}" required></div><div class="field"><label>Nachname</label><input name="last" value="${esc(p.last)}" required></div><div class="field"><label>Position</label><select name="pos">${['TW','IV','AV','ZM','ZOM','RM','LM','ST'].map(x=>`<option ${p.pos===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Nummer</label><input name="num" type="number" value="${p.num}"></div><div class="field"><label>Alter</label><input name="age" type="number" value="${p.age}"></div><div class="field"><label>Starker Fuß</label><select name="foot"><option ${p.foot==='Rechts'?'selected':''}>Rechts</option><option ${p.foot==='Links'?'selected':''}>Links</option><option ${p.foot==='Beide'?'selected':''}>Beide</option></select></div></div><div class="sectiontitle"><h2>📸 Bild</h2></div><input type="file" accept="image/*" capture="environment" id="imgfile" onchange="previewImage(event)"><div id="imgpreview">${p.img?`<img class="previewImg" src="${p.img}">`:``}</div><div class="sectiontitle"><h2>📊 Statistik</h2></div><div class="grid">${[['games','Spiele'],['goals','Tore'],['assists','Vorlagen'],['shots','Schüsse'],['onTarget','Schüsse aufs Tor'],['yellow','Gelbe Karten'],['red','Rote Karten'],['saves','Paraden (TW)'],['clean','Zu Null (TW)']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" type="number" step="0.1" value="${p[k]||0}"></div>`).join('')}</div><div class="sectiontitle"><h2>🩺 Status</h2></div><div class="grid"><div class="field"><label>Verletzt?</label><select name="injured"><option value="0" ${!p.injured?'selected':''}>Nein</option><option value="1" ${p.injured?'selected':''}>Ja</option></select></div><div class="field"><label>Verletzung</label><input name="injury" value="${esc(p.injury)}"></div><div class="field"><label>Gesperrt?</label><select name="suspended"><option value="0" ${!p.suspended?'selected':''}>Nein</option><option value="1" ${p.suspended?'selected':''}>Ja</option></select></div><div class="field"><label>Grund der Sperre</label><input name="suspReason" value="${esc(p.suspReason)}"></div></div><div class="sectiontitle"><h2>⭐ Spielbewertungen</h2></div><div class="field"><label>Letzte Bewertungen, Komma-getrennt</label><input name="ratings" value="${p.ratings.join(', ')}" placeholder="7.5, 8.2, 9.0"></div><div class="row" style="margin-top:18px"><button class="btn primary" type="submit">Speichern & automatisch berechnen</button>${id?`<button type="button" class="btn danger" onclick="deletePlayer('${p.id}')">Löschen</button>`:''}</div></form>`)}
function newsForm(){openModal(`<div class="sheethead"><h2>📰 News erstellen</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveNews(event)"><div class="field"><label>Überschrift</label><input name="title" required></div><div class="field" style="margin-top:10px"><label>Nachricht</label><textarea name="text" required></textarea></div><div class="sectiontitle"><h2>🗳️ Optional: Abstimmung</h2></div><div class="field"><label>Abstimmung einfügen?</label><select name="poll" onchange="document.getElementById('pollfields').classList.toggle('hide',this.value==='0')"><option value="0">Nein</option><option value="1">Ja</option></select></div><div id="pollfields" class="hide"><div class="field" style="margin-top:10px"><label>Frage</label><input name="polltitle"></div><div class="field" style="margin-top:10px"><label>Antworten, durch Komma trennen</label><input name="pollopts" placeholder="Heinze, Hüller, Wachowski"></div></div><button class="btn primary" style="margin-top:18px">Veröffentlichen</button></form>`)}
function voteForm(){openModal(`<div class="sheethead"><h2>🗳️ Abstimmung erstellen</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveVote(event)"><div class="field"><label>Frage</label><input name="title" required placeholder="Wer war Spieler des Spiels?"></div><div class="field" style="margin-top:10px"><label>Spieler auswählen</label><div class="list" style="margin-top:6px">${data.players.map(p=>`<label class="voteopt"><span>${esc(p.first+' '+p.last)}</span><input type="checkbox" name="players" value="${p.id}"></label>`).join('')}</div></div><button class="btn primary" style="margin-top:18px">Vote erstellen</button></form>`)}
function openModal(html){let m=document.createElement('div');m.id='modal';m.className='modal show';m.innerHTML=html;document.body.appendChild(m)}function closeModal(){document.getElementById('modal')?.remove()}
function previewImage(e){const f=e.target.files[0],box=document.getElementById('imgpreview');if(!f||!box)return;const r=new FileReader();r.onload=()=>box.innerHTML=`<img class="previewImg" src="${r.result}">`;r.readAsDataURL(f)}
function compressImage(file,done){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.82))};img.src=r.result};r.readAsDataURL(file)}
function savePlayer(e,id,editing){e.preventDefault();let f=new FormData(e.target);let p=data.players.find(x=>x.id===id)||{id};for(let k of ['first','last','pos','foot','num','age','games','goals','assists','shots','onTarget','yellow','red','saves','clean','injury','suspReason']){if(f.has(k))p[k]=['num','age','games','goals','assists','shots','onTarget','yellow','red','saves','clean'].includes(k)?Number(f.get(k)):f.get(k)}p.injured=f.get('injured')==='1';p.suspended=f.get('suspended')==='1';p.ratings=String(f.get('ratings')||'').split(',').map(Number).filter(n=>!isNaN(n)&&n>0);let file=document.getElementById('imgfile')?.files[0];if(file){compressImage(file,(src)=>{p.img=src;finish()})}else finish();function finish(){if(!editing)data.players.push(p);save();closeModal();render()}}
function deletePlayer(id){if(confirm('Spieler wirklich löschen?')){data.players=data.players.filter(p=>p.id!==id);save();closeModal();render()}}
function deleteNews(id){if(me?.role!=='admin')return;if(confirm('News wirklich löschen?')){data.news=data.news.filter(n=>n.id!==id);save();render()}}
function saveNews(e){e.preventDefault();let f=new FormData(e.target);let poll=null;if(f.get('poll')==='1'){poll={id:'np'+Date.now(),title:f.get('polltitle'),options:String(f.get('pollopts')).split(',').map((x,i)=>({id:'o'+i,label:x.trim()})).filter(x=>x.label)};}data.news.unshift({id:'n'+Date.now(),title:f.get('title'),text:f.get('text'),time:new Date().toLocaleString('de-DE'),poll});save();closeModal();render()}
function saveVote(e){e.preventDefault();let f=new FormData(e.target),opts=f.getAll('players');if(opts.length<2)return alert('Bitte mindestens zwei Spieler auswählen.');data.votes.unshift({id:'v'+Date.now(),title:f.get('title'),type:'custom',options:opts,votes:{},closed:false});save();closeModal();render()}
function vote(vid,pid){let v=data.votes.find(x=>x.id===vid);if(!v)return;if(v.votes[me.id])return alert('Du hast bei dieser Abstimmung bereits abgestimmt.');v.votes[me.id]=pid;save();render()}
function castNews(pid,oid){let n=data.news.find(x=>x.poll?.id===pid);n.poll.votes=n.poll.votes||{};n.poll.votes[me.id]=oid;save();render()}
function go(t){tab=t;render()}function logout(){localStorage.removeItem('playerhub_session');me=null;tab='home';render()}function login(e){e.preventDefault();let f=new FormData(e.target),u=data.users.find(x=>x.name.toLowerCase()===String(f.get('name')).toLowerCase()&&x.pin===f.get('pin'));if(!u)return alert('Login nicht gefunden. Demo: Admin / 1234 oder Maximilian / 1111');me=u;localStorage.setItem('playerhub_session',u.id);render()}
function render(){if(!me){document.getElementById('root').innerHTML=`<div class="login"><form class="card loginbox" onsubmit="login(event)"><div class="eyebrow">PLAYERHUB</div><h1>Deine Spielerzentrale ⚽</h1><p class="hint">Login für Spieler, News, Abstimmungen und Statistiken.</p><div class="field"><label>Name</label><input name="name" placeholder="Maximilian" required></div><div class="field" style="margin-top:10px"><label>PIN</label><input name="pin" type="password" placeholder="••••" required></div><button class="btn primary" style="width:100%;margin-top:15px">Einloggen</button><p class="hint" style="margin-top:15px">Demo-Accounts: Admin / 1234 · Maximilian / 1111</p></form></div>`;return}if(tab==='admin'&&me.role!=='admin')tab='home';let content=tab==='home'?home():tab==='players'?players():tab==='news'?`<div class="hero"><div class="eyebrow">Updates</div><h1>News</h1><p>Alles rund um eure Spieler.</p></div>${newsList()}`:tab==='votes'?votes():admin();document.getElementById('root').innerHTML=header()+`<main class="main">${content}</main>`+nav()}
render();
</script></body></html>
